<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DeveshAI</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #050505;
  --panel: #0b0b0b;
  --panel2: #111111;
  --border: #242424;
  --text: #f5f5f5;
  --muted: #8c8c8c;
  --soft: #151515;
  --white: #ffffff;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

body {
  position: relative;
}

/* =========================================================
   ANIMATED BACKGROUND
========================================================= */

#bgCanvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  opacity: .55;
}

.noise {
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .035;
  background-image:
    repeating-radial-gradient(
      circle at 0 0,
      #fff 0,
      #fff 1px,
      transparent 1px,
      transparent 4px
    );
  mix-blend-mode: overlay;
}

/* =========================================================
   APP
========================================================= */

.app {
  position: relative;
  z-index: 2;
  display: grid;
  grid-template-columns: 250px 1fr;
  width: 100%;
  height: 100vh;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {
  border-right: 1px solid var(--border);
  background: rgba(5,5,5,.82);
  backdrop-filter: blur(25px);
  display: flex;
  flex-direction: column;
  padding: 18px;
  animation: sidebarIn .6s ease;
}

@keyframes sidebarIn {
  from {
    opacity: 0;
    transform: translateX(-25px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

.logo {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -1px;
  margin-bottom: 25px;
}

.logo span {
  color: #777;
}

.section-title {
  color: #666;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin: 18px 8px 8px;
}

.mode {
  width: 100%;
  border: 1px solid transparent;
  background: transparent;
  color: #aaa;
  padding: 11px 12px;
  border-radius: 11px;
  text-align: left;
  cursor: pointer;
  transition: .25s;
  margin-bottom: 4px;
}

.mode:hover {
  color: white;
  background: #101010;
  border-color: #222;
  transform: translateX(3px);
}

.mode.active {
  color: white;
  background: #151515;
  border-color: #303030;
}

.sidebar-bottom {
  margin-top: auto;
}

.status {
  border: 1px solid #202020;
  background: #0c0c0c;
  padding: 12px;
  border-radius: 12px;
  font-size: 11px;
  color: #777;
}

.status-dot {
  width: 7px;
  height: 7px;
  display: inline-block;
  border-radius: 50%;
  background: #fff;
  margin-right: 7px;
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0%,100% {
    opacity: .35;
    transform: scale(.8);
  }
  50% {
    opacity: 1;
    transform: scale(1);
  }
}

/* =========================================================
   MAIN
========================================================= */

.main {
  min-width: 0;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar {
  height: 62px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  background: rgba(5,5,5,.7);
  backdrop-filter: blur(20px);
}

.top-title {
  font-weight: 700;
  font-size: 15px;
}

.top-subtitle {
  color: #666;
  font-size: 11px;
  margin-top: 2px;
}

.top-actions {
  display: flex;
  gap: 8px;
}

.icon-btn {
  width: 36px;
  height: 36px;
  border: 1px solid #222;
  background: #0d0d0d;
  color: #aaa;
  border-radius: 10px;
  cursor: pointer;
  transition: .25s;
}

.icon-btn:hover {
  color: white;
  border-color: #444;
  transform: translateY(-2px);
}

/* =========================================================
   CONTENT
========================================================= */

.content {
  flex: 1;
  min-height: 0;
  position: relative;
}

.chat {
  height: 100%;
  overflow-y: auto;
  padding: 30px;
  scroll-behavior: smooth;
}

.chat::-webkit-scrollbar {
  width: 5px;
}

.chat::-webkit-scrollbar-thumb {
  background: #222;
  border-radius: 10px;
}

/* =========================================================
   WELCOME
========================================================= */

.welcome {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  animation: welcomeIn .8s ease;
}

@keyframes welcomeIn {
  from {
    opacity: 0;
    transform: translateY(25px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.welcome h1 {
  font-size: clamp(38px, 6vw, 75px);
  letter-spacing: -4px;
  font-weight: 900;
}

.welcome h1 span {
  color: #666;
}

.welcome p {
  color: #777;
  max-width: 600px;
  margin-top: 12px;
  line-height: 1.6;
}

.quick-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  max-width: 750px;
  width: 100%;
  margin-top: 30px;
}

.quick {
  border: 1px solid #222;
  background: rgba(13,13,13,.75);
  padding: 18px;
  border-radius: 14px;
  color: #aaa;
  cursor: pointer;
  text-align: left;
  transition: .3s;
}

.quick:hover {
  color: white;
  border-color: #444;
  transform: translateY(-5px);
  background: #111;
}

.quick strong {
  display: block;
  color: white;
  margin-bottom: 6px;
}

/* =========================================================
   MESSAGES
========================================================= */

.message {
  max-width: 900px;
  margin: 0 auto 24px;
  animation: messageIn .35s ease;
}

@keyframes messageIn {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.message.user {
  display: flex;
  justify-content: flex-end;
}

.bubble {
  max-width: 80%;
  padding: 14px 16px;
  border-radius: 15px;
  white-space: pre-wrap;
  line-height: 1.65;
  font-size: 14px;
}

.user .bubble {
  background: #eeeeee;
  color: #050505;
}

.assistant .bubble {
  background: #0e0e0e;
  border: 1px solid #222;
  color: #ddd;
}

.message-tools {
  display: flex;
  gap: 6px;
  margin-top: 7px;
}

.message-tools button {
  border: 0;
  background: transparent;
  color: #555;
  cursor: pointer;
  font-size: 11px;
}

.message-tools button:hover {
  color: #aaa;
}

/* =========================================================
   GENERATION CARDS
========================================================= */

.generation-card {
  max-width: 900px;
  margin: 20px auto;
  border: 1px solid #292929;
  background: rgba(10,10,10,.9);
  border-radius: 18px;
  padding: 16px;
  animation: cardIn .5s ease;
}

@keyframes cardIn {
  from {
    opacity: 0;
    transform: scale(.97);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

.generation-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.generation-title {
  font-weight: 700;
}

.generation-status {
  font-size: 11px;
  color: #777;
}

.generated-image {
  display: block;
  width: 100%;
  max-height: 650px;
  object-fit: contain;
  border-radius: 12px;
  background: #050505;
}

.generated-video {
  display: block;
  width: 100%;
  max-height: 650px;
  border-radius: 12px;
  background: #000;
}

.download-btn {
  display: inline-block;
  margin-top: 12px;
  border: 1px solid #333;
  background: #111;
  color: white;
  padding: 9px 13px;
  border-radius: 9px;
  text-decoration: none;
  font-size: 12px;
}

.download-btn:hover {
  background: #191919;
}

/* =========================================================
   PROGRESS
========================================================= */

.progress-wrap {
  margin-top: 15px;
}

.progress-track {
  height: 5px;
  background: #191919;
  border-radius: 10px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: white;
  transition: width .5s ease;
}

.progress-text {
  margin-top: 8px;
  font-size: 11px;
  color: #666;
}

/* =========================================================
   COMPOSER
========================================================= */

.composer-area {
  padding: 15px 20px 20px;
  border-top: 1px solid #1b1b1b;
  background: rgba(5,5,5,.85);
  backdrop-filter: blur(25px);
}

.composer {
  max-width: 1000px;
  margin: auto;
  border: 1px solid #292929;
  background: #0c0c0c;
  border-radius: 17px;
  padding: 9px;
  display: flex;
  align-items: flex-end;
  gap: 8px;
  transition: .25s;
}

.composer:focus-within {
  border-color: #555;
  box-shadow: 0 0 30px rgba(255,255,255,.04);
}

textarea {
  flex: 1;
  min-height: 42px;
  max-height: 180px;
  resize: none;
  border: 0;
  outline: 0;
  background: transparent;
  color: white;
  padding: 11px;
  font: inherit;
}

textarea::placeholder {
  color: #555;
}

.tool-btn {
  width: 40px;
  height: 40px;
  border: 1px solid #242424;
  background: #101010;
  color: #aaa;
  border-radius: 10px;
  cursor: pointer;
  transition: .25s;
}

.tool-btn:hover {
  color: white;
  border-color: #444;
  transform: translateY(-2px);
}

.send-btn {
  width: 42px;
  height: 42px;
  border: 0;
  background: white;
  color: black;
  border-radius: 11px;
  cursor: pointer;
  font-weight: 900;
  transition: .25s;
}

.send-btn:hover {
  transform: scale(1.06);
}

.send-btn:disabled {
  opacity: .3;
  cursor: not-allowed;
  transform: none;
}

.composer-info {
  max-width: 1000px;
  margin: 8px auto 0;
  color: #444;
  font-size: 10px;
  display: flex;
  justify-content: space-between;
}

/* =========================================================
   MODE PANEL
========================================================= */

.mode-panel {
  display: none;
  position: absolute;
  bottom: 95px;
  left: 20px;
  width: 280px;
  border: 1px solid #292929;
  background: #0a0a0a;
  border-radius: 15px;
  padding: 10px;
  z-index: 10;
  box-shadow: 0 20px 60px rgba(0,0,0,.7);
}

.mode-panel.show {
  display: block;
  animation: panelIn .2s ease;
}

@keyframes panelIn {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.mode-option {
  padding: 12px;
  border-radius: 10px;
  cursor: pointer;
  color: #999;
}

.mode-option:hover,
.mode-option.active {
  background: #151515;
  color: white;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 800px) {

  .app {
    grid-template-columns: 1fr;
  }

  .sidebar {
    display: none;
  }

  .chat {
    padding: 18px;
  }

  .quick-grid {
    grid-template-columns: 1fr;
  }

  .bubble {
    max-width: 92%;
  }

  .composer-area {
    padding: 10px;
  }

  .topbar {
    padding: 0 12px;
  }

  .welcome h1 {
    letter-spacing: -2px;
  }
}
</style>
</head>

<body>

<canvas id="bgCanvas"></canvas>
<div class="noise"></div>

<div class="app">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="logo">
      Devesh<span>AI</span>
    </div>

    <div class="section-title">
      Workspace
    </div>

    <button class="mode active" data-mode="Ask">
      ✦ Ask
    </button>

    <button class="mode" data-mode="Study">
      ◈ Study
    </button>

    <button class="mode" data-mode="Create">
      ◆ Create
    </button>

    <button class="mode" data-mode="Code">
      ◇ Code
    </button>

    <button class="mode" data-mode="Analyze">
      ◎ Analyze
    </button>

    <div class="section-title">
      Generate
    </div>

    <button class="mode" onclick="openImageMode()">
      ▣ Image
    </button>

    <button class="mode" onclick="openVideoMode()">
      ▰ Video
    </button>

    <div class="sidebar-bottom">

      <div class="status">
        <span class="status-dot"></span>
        DeveshAI Online
      </div>

    </div>

  </aside>

  <!-- MAIN -->

  <main class="main">

    <header class="topbar">

      <div>
        <div class="top-title" id="topTitle">
          DeveshAI
        </div>

        <div class="top-subtitle" id="topSubtitle">
          AI workspace
        </div>
      </div>

      <div class="top-actions">

        <button
          class="icon-btn"
          onclick="newChat()"
          title="New chat">
          +
        </button>

        <button
          class="icon-btn"
          onclick="clearChat()"
          title="Clear">
          ×
        </button>

      </div>

    </header>

    <section class="content">

      <div class="chat" id="chat">

        <div class="welcome" id="welcome">

          <h1>
            Devesh<span>AI</span>
          </h1>

          <p>
            One workspace for conversation, creation,
            image generation and video generation.
          </p>

          <div class="quick-grid">

            <button
              class="quick"
              onclick="quickPrompt('Explain quantum computing in very simple Hinglish.')">
              <strong>Ask anything</strong>
              Get a clear AI answer.
            </button>

            <button
              class="quick"
              onclick="openImageMode()">
              <strong>Generate image</strong>
              Create an image from your idea.
            </button>

            <button
              class="quick"
              onclick="openVideoMode()">
              <strong>Generate video</strong>
              Create a short AI video.
            </button>

          </div>

        </div>

      </div>

      <!-- MODE PANEL -->

      <div class="mode-panel" id="modePanel">

        <div
          class="mode-option active"
          onclick="setMode('Ask')">
          Ask
        </div>

        <div
          class="mode-option"
          onclick="setMode('Study')">
          Study
        </div>

        <div
          class="mode-option"
          onclick="setMode('Create')">
          Create
        </div>

        <div
          class="mode-option"
          onclick="setMode('Code')">
          Code
        </div>

        <div
          class="mode-option"
          onclick="setMode('Analyze')">
          Analyze
        </div>

      </div>

    </section>

    <!-- COMPOSER -->

    <div class="composer-area">

      <div class="composer">

        <button
          class="tool-btn"
          onclick="toggleModePanel()"
          title="Modes">
          ◉
        </button>

        <button
          class="tool-btn"
          onclick="openImageMode()"
          title="Image generation">
          ▣
        </button>

        <button
          class="tool-btn"
          onclick="openVideoMode()"
          title="Video generation">
          ▰
        </button>

        <textarea
          id="input"
          placeholder="Message DeveshAI..."
          rows="1"></textarea>

        <button
          class="send-btn"
          id="sendBtn"
          onclick="sendCurrent()">
          ↑
        </button>

      </div>

      <div class="composer-info">

        <span id="modeLabel">
          Ask mode
        </span>

        <span>
          Enter to send · Shift+Enter for new line
        </span>

      </div>

    </div>

  </main>

</div>

<script>
/* =========================================================
   STATE
========================================================= */

const state = {
  mode: "Ask",
  messages: [],
  generating: false,
  currentGeneration: null
};

/* =========================================================
   DOM
========================================================= */

const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const modeLabel = document.getElementById("modeLabel");
const topTitle = document.getElementById("topTitle");
const topSubtitle = document.getElementById("topSubtitle");

/* =========================================================
   MODE INSTRUCTIONS
========================================================= */

const modeInstructions = {

  Ask:
    "Answer clearly and naturally.",

  Study:
    "Teach step-by-step using simple language. Give examples when useful.",

  Create:
    "Help creatively with writing, ideas, concepts and content.",

  Code:
    "Write correct, complete, runnable code. Explain important parts simply.",

  Analyze:
    "Analyze carefully. Separate facts, assumptions, risks and conclusions."

};

/* =========================================================
   BACKGROUND ANIMATION
========================================================= */

const canvas = document.getElementById("bgCanvas");
const ctx = canvas.getContext("2d");

let particles = [];

function resizeCanvas() {

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  particles = [];

  const count =
    Math.min(
      90,
      Math.floor(window.innerWidth / 15)
    );

  for (let i = 0; i < count; i++) {

    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      vx: (Math.random() - .5) * .25,
      vy: (Math.random() - .5) * .25,
      r: Math.random() * 1.5 + .2
    });

  }
}

function animateBackground() {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  for (const p of particles) {

    p.x += p.vx;
    p.y += p.vy;

    if (p.x < 0 || p.x > canvas.width) {
      p.vx *= -1;
    }

    if (p.y < 0 || p.y > canvas.height) {
      p.vy *= -1;
    }

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.r,
      0,
      Math.PI * 2
    );

    ctx.fillStyle = "#555";
    ctx.fill();
  }

  for (let i = 0; i < particles.length; i++) {

    for (let j = i + 1; j < particles.length; j++) {

      const a = particles[i];
      const b = particles[j];

      const dx = a.x - b.x;
      const dy = a.y - b.y;

      const distance =
        Math.sqrt(dx * dx + dy * dy);

      if (distance < 110) {

        ctx.beginPath();

        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);

        ctx.strokeStyle =
          `rgba(255,255,255,${(
            1 - distance / 110
          ) * .08})`;

        ctx.stroke();
      }
    }
  }

  requestAnimationFrame(
    animateBackground
  );
}

window.addEventListener(
  "resize",
  resizeCanvas
);

resizeCanvas();
animateBackground();

/* =========================================================
   MODE
========================================================= */

function setMode(mode) {

  state.mode = mode;

  document
    .querySelectorAll(".mode")
    .forEach(btn => {

      btn.classList.toggle(
        "active",
        btn.dataset.mode === mode
      );

    });

  document
    .querySelectorAll(".mode-option")
    .forEach(option => {

      option.classList.toggle(
        "active",
        option.textContent.trim() === mode
      );

    });

  modeLabel.textContent =
    mode + " mode";

  topSubtitle.textContent =
    modeInstructions[mode];

  document.getElementById(
    "modePanel"
  ).classList.remove("show");
}

/* =========================================================
   MODE PANEL
========================================================= */

function toggleModePanel() {

  document
    .getElementById("modePanel")
    .classList.toggle("show");

}

/* =========================================================
   CHAT RENDER
========================================================= */

function renderMessage(
  role,
  text
) {

  if (welcome) {
    welcome.style.display = "none";
  }

  const wrapper =
    document.createElement("div");

  wrapper.className =
    `message ${role}`;

  const bubble =
    document.createElement("div");

  bubble.className = "bubble";

  bubble.textContent = text;

  wrapper.appendChild(bubble);

  if (role === "assistant") {

    const tools =
      document.createElement("div");

    tools.className =
      "message-tools";

    const copy =
      document.createElement("button");

    copy.textContent = "Copy";

    copy.onclick = () => {

      navigator.clipboard.writeText(text);

      copy.textContent = "Copied";

      setTimeout(() => {
        copy.textContent = "Copy";
      }, 1200);

    };

    tools.appendChild(copy);

    wrapper.appendChild(tools);
  }

  chat.appendChild(wrapper);

  chat.scrollTop =
    chat.scrollHeight;
}

/* =========================================================
   SEND CHAT
========================================================= */

async function sendCurrent() {

  const text =
    input.value.trim();

  if (!text || state.generating) {
    return;
  }

  input.value = "";
  autoResize();

  await sendChat(text);
}

async function sendChat(text) {

  state.generating = true;
  sendBtn.disabled = true;

  renderMessage(
    "user",
    text
  );

  state.messages.push({
    role: "user",
    content: text
  });

  const thinking =
    document.createElement("div");

  thinking.className =
    "message assistant";

  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  bubble.textContent =
    "DeveshAI is thinking…";

  thinking.appendChild(bubble);

  chat.appendChild(thinking);

  chat.scrollTop =
    chat.scrollHeight;

  try {

    const messages = [
      {
        role: "system",
        content:
          `Current mode: ${state.mode}.
           ${modeInstructions[state.mode]}`
      },
      ...state.messages
    ];

    const response =
      await fetch(
        "/api/chat",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            messages
          })
        }
      );

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data.error ||
        "Chat request failed."
      );
    }

    thinking.remove();

    const reply =
      data.reply ||
      "I couldn't generate a response.";

    renderMessage(
      "assistant",
      reply
    );

    state.messages.push({
      role: "assistant",
      content: reply
    });

  } catch (error) {

    thinking.remove();

    renderMessage(
      "assistant",
      "Error: " + error.message
    );

  } finally {

    state.generating = false;
    sendBtn.disabled = false;

  }
}

/* =========================================================
   QUICK PROMPT
========================================================= */

function quickPrompt(text) {

  input.value = text;

  autoResize();

  sendCurrent();
}

/* =========================================================
   IMAGE GENERATION
========================================================= */

function openImageMode() {

  const prompt =
    window.prompt(
      "What image should DeveshAI generate?"
    );

  if (!prompt || !prompt.trim()) {
    return;
  }

  generateImage(
    prompt.trim()
  );
}

async function generateImage(prompt) {

  state.generating = true;

  sendBtn.disabled = true;

  showGenerationCard(
    "image",
    prompt,
    "Generating image..."
  );

  try {

    const response =
      await fetch(
        "/api/image",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            prompt,
            size: "1024x1024",
            quality: "auto",
            background: "auto"
          })
        }
      );

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data.error ||
        "Image generation failed."
      );
    }

    updateImageCard(
      data.image,
      prompt
    );

  } catch (error) {

    updateGenerationError(
      "image",
      error.message
    );

  } finally {

    state.generating = false;
    sendBtn.disabled = false;

  }
}

/* =========================================================
   VIDEO GENERATION
========================================================= */

function openVideoMode() {

  const prompt =
    window.prompt(
      "What video should DeveshAI generate?"
    );

  if (!prompt || !prompt.trim()) {
    return;
  }

  generateVideo(
    prompt.trim()
  );
}

async function generateVideo(prompt) {

  state.generating = true;

  sendBtn.disabled = true;

  const card =
    showGenerationCard(
      "video",
      prompt,
      "Starting video generation..."
    );

  try {

    const response =
      await fetch(
        "/api/video",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            prompt,
            model: "sora-2",
            seconds: "4",
            size: "1280x720"
          })
        }
      );

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data.error ||
        "Video generation failed."
      );
    }

    const videoId =
      data.video.id;

    updateVideoProgress(
      card,
      5,
      "Video job created..."
    );

    await pollVideo(
      card,
      videoId
    );

  } catch (error) {

    updateCardError(
      card,
      error.message
    );

  } finally {

    state.generating = false;
    sendBtn.disabled = false;

  }
}

async function pollVideo(
  card,
  videoId
) {

  let attempts = 0;

  while (attempts < 120) {

    attempts++;

    await sleep(5000);

    const response =
      await fetch(
        `/api/video/${encodeURIComponent(videoId)}`
      );

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        data.error ||
        "Could not check video status."
      );

    }

    const video =
      data.video;

    const progress =
      Number(video.progress || 0);

    updateVideoProgress(
      card,
      progress,
      getVideoStatusText(
        video.status,
        progress
      )
    );

    if (
      video.status ===
      "completed"
    ) {

      showCompletedVideo(
        card,
        videoId
      );

      return;
    }

    if (
      video.status ===
      "failed"
    ) {

      throw new Error(
        video.error?.message ||
        "Video generation failed."
      );

    }

    if (
      video.status ===
      "canceled"
    ) {

      throw new Error(
        "Video generation was canceled."
      );

    }
  }

  throw new Error(
    "Video generation is taking too long. Please check again later."
  );
}

function getVideoStatusText(
  status,
  progress
) {

  if (status === "queued") {
    return "Waiting for generation...";
  }

  if (status === "in_progress") {
    return `Generating video... ${progress}%`;
  }

  if (status === "completed") {
    return "Video ready.";
  }

  return "Processing...";
}

/* =========================================================
   GENERATION CARDS
========================================================= */

function showGenerationCard(
  type,
  prompt,
  status
) {

  const card =
    document.createElement("div");

  card.className =
    "generation-card";

  card.dataset.type =
    type;

  const header =
    document.createElement("div");

  header.className =
    "generation-header";

  const title =
    document.createElement("div");

  title.className =
    "generation-title";

  title.textContent =
    type === "image"
      ? "Image Generation"
      : "Video Generation";

  const statusEl =
    document.createElement("div");

  statusEl.className =
    "generation-status";

  statusEl.textContent =
    status;

  header.appendChild(title);
  header.appendChild(statusEl);

  card.appendChild(header);

  const promptEl =
    document.createElement("div");

  promptEl.style.color = "#777";
  promptEl.style.fontSize = "12px";
  promptEl.style.marginBottom = "14px";
  promptEl.textContent =
    prompt;

  card.appendChild(promptEl);

  if (type === "video") {

    const progressWrap =
      document.createElement("div");

    progressWrap.className =
      "progress-wrap";

    progressWrap.innerHTML = `
      <div class="progress-track">
        <div class="progress-bar"></div>
      </div>
      <div class="progress-text">
        0%
      </div>
    `;

    card.appendChild(
      progressWrap
    );

  } else {

    const loading =
      document.createElement("div");

    loading.style.height = "300px";
    loading.style.borderRadius = "12px";
    loading.style.background =
      "linear-gradient(110deg,#090909,#181818,#090909)";
    loading.style.backgroundSize =
      "300% 100%";
    loading.style.animation =
      "loading 1.8s infinite";

    card.appendChild(
      loading
    );

  }

  chat.appendChild(card);

  chat.scrollTop =
    chat.scrollHeight;

  return card;
}

/* Add loading animation dynamically */

const style =
  document.createElement("style");

style.textContent = `
@keyframes loading {
  0% {
    background-position: 200% 0;
  }
  100% {
    background-position: -200% 0;
  }
}
`;

document.head.appendChild(style);

/* =========================================================
   IMAGE CARD UPDATE
========================================================= */

function updateImageCard(
  image,
  prompt
) {

  const cards =
    document.querySelectorAll(
      '.generation-card[data-type="image"]'
    );

  const card =
    cards[cards.length - 1];

  if (!card) return;

  card.innerHTML = "";

  const header =
    document.createElement("div");

  header.className =
    "generation-header";

  header.innerHTML = `
    <div class="generation-title">
      Generated Image
    </div>
    <div class="generation-status">
      Complete
    </div>
  `;

  card.appendChild(header);

  const img =
    document.createElement("img");

  img.className =
    "generated-image";

  img.src = image;
  img.alt = prompt;

  card.appendChild(img);

  const download =
    document.createElement("a");

  download.className =
    "download-btn";

  download.textContent =
    "Download image";

  download.href =
    image;

  download.download =
    "deveshai-image.png";

  card.appendChild(download);

  chat.scrollTop =
    chat.scrollHeight;
}

/* =========================================================
   VIDEO PROGRESS
========================================================= */

function updateVideoProgress(
  card,
  progress,
  text
) {

  const bar =
    card.querySelector(
      ".progress-bar"
    );

  const progressText =
    card.querySelector(
      ".progress-text"
    );

  const status =
    card.querySelector(
      ".generation-status"
    );

  if (bar) {
    bar.style.width =
      Math.max(
        0,
        Math.min(100, progress)
      ) + "%";
  }

  if (progressText) {
    progressText.textContent =
      Math.round(progress) + "%";
  }

  if (status) {
    status.textContent =
      text;
  }
}

/* =========================================================
   COMPLETED VIDEO
========================================================= */

function showCompletedVideo(
  card,
  videoId
) {

  card.innerHTML = "";

  const header =
    document.createElement("div");

  header.className =
    "generation-header";

  header.innerHTML = `
    <div class="generation-title">
      Generated Video
    </div>

    <div class="generation-status">
      Complete
    </div>
  `;

  card.appendChild(header);

  const video =
    document.createElement("video");

  video.className =
    "generated-video";

  video.controls = true;
  video.playsInline = true;

  video.src =
    `/api/video/${encodeURIComponent(videoId)}/content`;

  card.appendChild(video);

  const download =
    document.createElement("a");

  download.className =
    "download-btn";

  download.textContent =
    "Download video";

  download.href =
    video.src;

  download.download =
    `deveshai-${videoId}.mp4`;

  card.appendChild(download);

  chat.scrollTop =
    chat.scrollHeight;
}

/* =========================================================
   ERRORS
========================================================= */

function updateGenerationError(
  type,
  message
) {

  const cards =
    document.querySelectorAll(
      ".generation-card"
    );

  const card =
    cards[cards.length - 1];

  if (!card) return;

  updateCardError(
    card,
    message
  );
}

function updateCardError(
  card,
  message
) {

  const status =
    card.querySelector(
      ".generation-status"
    );

  if (status) {
    status.textContent =
      "Generation failed";
  }

  const error =
    document.createElement("div");

  error.style.marginTop =
    "15px";

  error.style.padding =
    "12px";

  error.style.border =
    "1px solid #333";

  error.style.borderRadius =
    "10px";

  error.style.color =
    "#aaa";

  error.textContent =
    message;

  card.appendChild(error);
}

/* =========================================================
   CHAT CONTROLS
========================================================= */

function clearChat() {

  state.messages = [];

  chat.innerHTML = "";

  chat.appendChild(
    createWelcome()
  );
}

function createWelcome() {

  const el =
    document.createElement("div");

  el.className =
    "welcome";

  el.innerHTML = `
    <h1>
      Devesh<span>AI</span>
    </h1>

    <p>
      One workspace for conversation,
      creation, image generation and video generation.
    </p>

    <div class="quick-grid">

      <button
        class="quick"
        onclick="quickPrompt('Explain quantum computing in very simple Hinglish.')">
        <strong>Ask anything</strong>
        Get a clear AI answer.
      </button>

      <button
        class="quick"
        onclick="openImageMode()">
        <strong>Generate image</strong>
        Create an image from your idea.
      </button>

      <button
        class="quick"
        onclick="openVideoMode()">
        <strong>Generate video</strong>
        Create a short AI video.
      </button>

    </div>
  `;

  return el;
}

function newChat() {

  state.messages = [];

  chat.innerHTML = "";

  chat.appendChild(
    createWelcome()
  );

  input.focus();
}

/* =========================================================
   INPUT
========================================================= */

input.addEventListener(
  "input",
  autoResize
);

function autoResize() {

  input.style.height =
    "auto";

  input.style.height =
    Math.min(
      input.scrollHeight,
      180
    ) + "px";
}

input.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendCurrent();
    }

  }
);

/* =========================================================
   HELPERS
========================================================= */

function sleep(ms) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );
}

/* =========================================================
   INITIAL
========================================================= */

setMode("Ask");

</script>
