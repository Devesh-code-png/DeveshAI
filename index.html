<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>DeveshAI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#050505;
  --panel:#090909;
  --panel2:#0e0e0e;
  --line:#202020;
  --line2:#303030;
  --text:#f5f5f5;
  --muted:#888;
  --soft:#bdbdbd;
  --white:#fff;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,
textarea,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

#background{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
}

.app{
  position:relative;
  z-index:1;
  width:100%;
  height:100%;
  display:flex;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
  width:270px;
  height:100%;
  flex-shrink:0;
  background:rgba(7,7,7,.92);
  border-right:1px solid var(--line);
  backdrop-filter:blur(20px);
  display:flex;
  flex-direction:column;
  padding:18px 14px;
  transition:.3s ease;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  padding:8px 8px 22px;
}

.brand-mark{
  width:38px;
  height:38px;
  border:1px solid #444;
  border-radius:12px;
  display:grid;
  place-items:center;
  font-weight:800;
  background:#0b0b0b;
  box-shadow:0 0 30px rgba(255,255,255,.05);
}

.brand-text{
  font-size:18px;
  font-weight:750;
  letter-spacing:-.5px;
}

.brand-sub{
  font-size:10px;
  color:#666;
  margin-top:2px;
}

.new-chat{
  width:100%;
  padding:13px 14px;
  border:1px solid var(--line2);
  border-radius:12px;
  background:#101010;
  color:#fff;
  text-align:left;
  transition:.2s;
}

.new-chat:hover{
  background:#181818;
  border-color:#555;
  transform:translateY(-1px);
}

.nav{
  margin-top:18px;
  display:flex;
  flex-direction:column;
  gap:5px;
}

.nav-btn{
  width:100%;
  display:flex;
  align-items:center;
  gap:11px;
  padding:11px 12px;
  border:1px solid transparent;
  border-radius:10px;
  background:transparent;
  color:#aaa;
  text-align:left;
  transition:.2s;
}

.nav-btn:hover{
  background:#101010;
  color:#fff;
}

.nav-btn.active{
  background:#151515;
  border-color:#292929;
  color:#fff;
}

.nav-icon{
  width:20px;
  text-align:center;
  color:#777;
}

.nav-btn.active .nav-icon{
  color:#fff;
}

.sidebar-bottom{
  margin-top:auto;
}

.status-card{
  border:1px solid var(--line);
  background:#0b0b0b;
  border-radius:13px;
  padding:12px;
  color:#777;
  font-size:11px;
}

.status-dot{
  display:inline-block;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#fff;
  margin-right:7px;
  box-shadow:0 0 12px #fff;
}

/* =========================================================
   MAIN
========================================================= */

.main{
  min-width:0;
  flex:1;
  height:100%;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:64px;
  flex-shrink:0;
  border-bottom:1px solid rgba(255,255,255,.07);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  background:rgba(5,5,5,.55);
  backdrop-filter:blur(16px);
}

.top-left{
  display:flex;
  align-items:center;
  gap:10px;
}

.mobile-menu{
  display:none;
  border:1px solid var(--line);
  background:#0d0d0d;
  color:#fff;
  width:38px;
  height:38px;
  border-radius:10px;
}

.mode-label{
  font-size:14px;
  color:#ddd;
  font-weight:650;
}

.top-right{
  display:flex;
  align-items:center;
  gap:8px;
}

.top-action{
  width:36px;
  height:36px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#0b0b0b;
  color:#999;
}

.top-action:hover{
  color:#fff;
  border-color:#444;
}

/* =========================================================
   CONTENT
========================================================= */

.content{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  position:relative;
}

.welcome{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px;
}

.welcome-inner{
  width:min(820px,100%);
  text-align:center;
}

.hero-symbol{
  position:relative;
  width:100px;
  height:100px;
  margin:0 auto 28px;
  display:grid;
  place-items:center;
}

.hero-symbol::before,
.hero-symbol::after{
  content:"";
  position:absolute;
  border:1px solid rgba(255,255,255,.25);
  border-radius:50%;
  animation:pulseRing 3s ease-in-out infinite;
}

.hero-symbol::before{
  inset:8px;
}

.hero-symbol::after{
  inset:-5px;
  opacity:.4;
  animation-delay:1s;
}

.hero-core{
  width:38px;
  height:38px;
  border:1px solid #777;
  border-radius:12px;
  transform:rotate(45deg);
  animation:coreFloat 4s ease-in-out infinite;
}

.welcome h1{
  font-size:clamp(32px,5vw,58px);
  letter-spacing:-2.5px;
  line-height:1;
  margin-bottom:15px;
}

.welcome p{
  color:#888;
  font-size:15px;
}

.quick-grid{
  margin-top:35px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.quick{
  padding:16px;
  border:1px solid var(--line);
  background:rgba(10,10,10,.7);
  color:#aaa;
  border-radius:13px;
  text-align:left;
  transition:.25s;
}

.quick:hover{
  color:#fff;
  border-color:#4a4a4a;
  transform:translateY(-3px);
  background:#111;
}

.quick-title{
  color:#eee;
  font-size:13px;
  font-weight:650;
  margin-bottom:5px;
}

.quick-desc{
  color:#666;
  font-size:11px;
}

/* =========================================================
   MESSAGES
========================================================= */

.messages{
  display:none;
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:30px max(22px,calc((100% - 900px)/2));
  scroll-behavior:smooth;
}

.messages::-webkit-scrollbar{
  width:8px;
}

.messages::-webkit-scrollbar-track{
  background:#080808;
}

.messages::-webkit-scrollbar-thumb{
  background:#333;
  border-radius:20px;
}

.message{
  margin-bottom:25px;
  animation:messageIn .3s ease;
}

.message-row{
  display:flex;
  gap:12px;
}

.message.user .message-row{
  justify-content:flex-end;
}

.avatar{
  width:30px;
  height:30px;
  flex-shrink:0;
  border:1px solid #333;
  border-radius:9px;
  display:grid;
  place-items:center;
  font-size:10px;
  background:#0d0d0d;
}

.message.user .avatar{
  order:2;
}

.bubble{
  max-width:min(760px,85%);
  border:1px solid #202020;
  background:#0b0b0b;
  border-radius:15px;
  padding:13px 15px;
  color:#ddd;
  line-height:1.65;
  font-size:14px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.message.user .bubble{
  background:#151515;
  border-color:#292929;
}

.message-tools{
  margin-top:7px;
  display:flex;
  gap:5px;
}

.msg-action{
  border:1px solid #202020;
  background:#0b0b0b;
  color:#777;
  border-radius:7px;
  padding:4px 8px;
  font-size:10px;
}

.msg-action:hover{
  color:#fff;
}

/* =========================================================
   ATTACHMENTS
========================================================= */

.attachment-strip{
  display:none;
  width:min(900px,calc(100% - 32px));
  margin:0 auto 10px;
  gap:8px;
  flex-wrap:wrap;
}

.attachment-chip{
  display:flex;
  align-items:center;
  gap:8px;
  border:1px solid #292929;
  background:#0d0d0d;
  padding:8px 10px;
  border-radius:9px;
  font-size:11px;
  color:#bbb;
}

.attachment-remove{
  border:0;
  background:transparent;
  color:#666;
}

.attachment-remove:hover{
  color:#fff;
}

/* =========================================================
   COMPOSER
========================================================= */

.composer-area{
  padding:0 18px 18px;
}

.composer{
  width:min(900px,100%);
  margin:auto;
  border:1px solid #292929;
  background:rgba(9,9,9,.92);
  border-radius:18px;
  box-shadow:0 20px 70px rgba(0,0,0,.45);
  backdrop-filter:blur(20px);
  overflow:hidden;
  transition:.25s;
}

.composer:focus-within{
  border-color:#484848;
  box-shadow:
    0 20px 70px rgba(0,0,0,.5),
    0 0 0 1px rgba(255,255,255,.04);
}

.prompt{
  width:100%;
  min-height:58px;
  max-height:190px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  padding:17px 17px 8px;
  line-height:1.5;
  font-size:14px;
}

.prompt::placeholder{
  color:#555;
}

.composer-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 10px 10px;
}

.tools{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

.tool{
  height:34px;
  padding:0 10px;
  border:1px solid #202020;
  border-radius:9px;
  background:#0c0c0c;
  color:#777;
  font-size:11px;
  transition:.2s;
}

.tool:hover{
  color:#fff;
  border-color:#444;
}

.tool.active{
  color:#fff;
  border-color:#fff;
  box-shadow:0 0 18px rgba(255,255,255,.08);
}

.send{
  width:38px;
  height:38px;
  border:1px solid #555;
  border-radius:11px;
  background:#fff;
  color:#000;
  font-size:15px;
  transition:.2s;
}

.send:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 25px rgba(255,255,255,.15);
}

.send:disabled{
  opacity:.35;
  transform:none;
}

.stop-btn{
  display:none;
  width:38px;
  height:38px;
  border:1px solid #555;
  border-radius:11px;
  background:#111;
  color:#fff;
}

/* =========================================================
   COMMAND CENTER
========================================================= */

.command-overlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:20;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(15px);
  align-items:flex-start;
  justify-content:center;
  padding-top:12vh;
}

.command-box{
  width:min(650px,calc(100% - 30px));
  border:1px solid #333;
  border-radius:18px;
  background:#0b0b0b;
  box-shadow:0 30px 100px rgba(0,0,0,.7);
  overflow:hidden;
}

.command-input{
  width:100%;
  height:58px;
  border:0;
  border-bottom:1px solid #202020;
  outline:0;
  background:#101010;
  color:#fff;
  padding:0 18px;
}

.command-list{
  max-height:380px;
  overflow:auto;
  padding:8px;
}

.command-item{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border:0;
  background:transparent;
  color:#aaa;
  padding:13px;
  border-radius:10px;
  text-align:left;
}

.command-item:hover{
  background:#161616;
  color:#fff;
}

.command-key{
  color:#555;
  font-size:10px;
}

/* =========================================================
   STATUS
========================================================= */

.status{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translate(-50%,20px);
  z-index:50;
  padding:9px 14px;
  border:1px solid #333;
  border-radius:10px;
  background:#0b0b0b;
  color:#aaa;
  font-size:11px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

.status.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* =========================================================
   VOICE PANEL
========================================================= */

.voice-panel{
  display:none;
  position:fixed;
  inset:0;
  z-index:15;
  background:rgba(0,0,0,.8);
  backdrop-filter:blur(18px);
  align-items:center;
  justify-content:center;
}

.voice-panel.show{
  display:flex;
}

.voice-card{
  width:min(440px,calc(100% - 30px));
  border:1px solid #333;
  background:#0a0a0a;
  border-radius:22px;
  padding:32px;
  text-align:center;
  box-shadow:0 30px 100px rgba(0,0,0,.75);
}

.voice-visual{
  position:relative;
  width:130px;
  height:130px;
  margin:0 auto 25px;
  display:grid;
  place-items:center;
}

.voice-ring{
  position:absolute;
  inset:0;
  border:1px solid #444;
  border-radius:50%;
  animation:voicePulse 1.7s ease-in-out infinite;
}

.voice-ring:nth-child(2){
  inset:14px;
  animation-delay:.35s;
}

.voice-ring:nth-child(3){
  inset:28px;
  animation-delay:.7s;
}

.voice-core{
  width:44px;
  height:44px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 35px rgba(255,255,255,.25);
  animation:coreBeat 1.2s ease-in-out infinite;
}

.voice-title{
  font-size:21px;
  font-weight:700;
}

.voice-state{
  color:#777;
  margin-top:7px;
  font-size:12px;
}

.voice-close{
  margin-top:25px;
  padding:10px 18px;
  border:1px solid #333;
  border-radius:10px;
  background:#111;
  color:#aaa;
}

.voice-close:hover{
  color:#fff;
}

/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes pulseRing{
  0%,100%{transform:scale(.9);opacity:.25}
  50%{transform:scale(1.08);opacity:.7}
}

@keyframes coreFloat{
  0%,100%{transform:rotate(45deg) translateY(0)}
  50%{transform:rotate(45deg) translateY(-7px)}
}

@keyframes coreBeat{
  0%,100%{transform:scale(.92)}
  50%{transform:scale(1.08)}
}

@keyframes voicePulse{
  0%,100%{transform:scale(.9);opacity:.2}
  50%{transform:scale(1.1);opacity:.8}
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(8px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:800px){

  .sidebar{
    position:fixed;
    left:-280px;
    top:0;
    z-index:30;
    box-shadow:20px 0 70px rgba(0,0,0,.6);
  }

  .sidebar.open{
    left:0;
  }

  .mobile-menu{
    display:block;
  }

  .quick-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .welcome{
    padding:20px;
  }

}

@media(max-width:520px){

  .topbar{
    padding:0 12px;
  }

  .quick-grid{
    grid-template-columns:1fr;
  }

  .welcome h1{
    font-size:38px;
  }

  .messages{
    padding:20px 12px;
  }

  .composer-area{
    padding:0 10px 10px;
  }

  .tool span{
    display:none;
  }

  .voice-card{
    padding:25px;
  }

}
</style>
</head>

<body>

<canvas id="background"></canvas>

<div class="app">

  <!-- =====================================================
       SIDEBAR
  ====================================================== -->

  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <div class="brand-mark">D</div>

      <div>
        <div class="brand-text">DeveshAI</div>
        <div class="brand-sub">INTELLIGENT WORKSPACE</div>
      </div>
    </div>

    <button class="new-chat" onclick="newChat()">
      ＋ New conversation
    </button>

    <nav class="nav">

      <button class="nav-btn active" data-mode="Ask" onclick="setMode('Ask')">
        <span class="nav-icon">◈</span>
        <span>Ask</span>
      </button>

      <button class="nav-btn" data-mode="Study" onclick="setMode('Study')">
        <span class="nav-icon">⌁</span>
        <span>Study</span>
      </button>

      <button class="nav-btn" data-mode="Create" onclick="setMode('Create')">
        <span class="nav-icon">✦</span>
        <span>Create</span>
      </button>

      <button class="nav-btn" data-mode="Code" onclick="setMode('Code')">
        <span class="nav-icon">&lt;/&gt;</span>
        <span>Code</span>
      </button>

      <button class="nav-btn" data-mode="Analyze" onclick="setMode('Analyze')">
        <span class="nav-icon">⌘</span>
        <span>Analyze</span>
      </button>

    </nav>

    <div class="sidebar-bottom">

      <div class="status-card">
        <span class="status-dot"></span>
        DeveshAI online
      </div>

    </div>

  </aside>


  <!-- =====================================================
       MAIN
  ====================================================== -->

  <main class="main">

    <header class="topbar">

      <div class="top-left">

        <button
          class="mobile-menu"
          onclick="toggleSidebar()">
          ☰
        </button>

        <div class="mode-label" id="modeLabel">
          Ask
        </div>

      </div>

      <div class="top-right">

        <button
          class="top-action"
          title="Command Center"
          onclick="openCommandCenter()">
          ⌘
        </button>

        <button
          class="top-action"
          title="New chat"
          onclick="newChat()">
          ＋
        </button>

      </div>

    </header>


    <section class="content">

      <!-- =================================================
           WELCOME
      ================================================== -->

      <div class="welcome" id="welcome">

        <div class="welcome-inner">

          <div class="hero-symbol">
            <div class="hero-core"></div>
          </div>

          <h1>What can I help you with?</h1>

          <p>
            Ask, study, create, code or analyze with DeveshAI.
          </p>

          <div class="quick-grid">

            <button
              class="quick"
              onclick="quickPrompt('Explain a difficult topic to me in very simple language.')">

              <div class="quick-title">
                Explain
              </div>

              <div class="quick-desc">
                Make something easy to understand.
              </div>

            </button>


            <button
              class="quick"
              onclick="quickPrompt('Help me study for my next exam.')">

              <div class="quick-title">
                Study
              </div>

              <div class="quick-desc">
                Learn with step-by-step help.
              </div>

            </button>


            <button
              class="quick"
              onclick="quickPrompt('Give me an original creative idea for a project.')">

              <div class="quick-title">
                Create
              </div>

              <div class="quick-desc">
                Turn ideas into something real.
              </div>

            </button>


            <button
              class="quick"
              onclick="quickPrompt('Help me debug or improve my code.')">

              <div class="quick-title">
                Code
              </div>

              <div class="quick-desc">
                Build and fix software.
              </div>

            </button>

          </div>

        </div>

      </div>


      <!-- =================================================
           MESSAGES
      ================================================== -->

      <div
        class="messages"
        id="messages">
      </div>


      <!-- =================================================
           ATTACHMENTS
      ================================================== -->

      <div
        class="attachment-strip"
        id="attachmentStrip">
      </div>


      <!-- =================================================
           COMPOSER
      ================================================== -->

      <div class="composer-area">

        <div class="composer">

          <textarea
            id="prompt"
            class="prompt"
            rows="1"
            placeholder="Ask DeveshAI anything..."
            autocomplete="off"></textarea>


          <div class="composer-bottom">

            <div class="tools">

              <button
                class="tool"
                onclick="openFilePicker()">
                ＋ <span>Attach</span>
              </button>

              <button
                class="tool"
                id="voiceBtn"
                onclick="toggleVoice()">
                ◉ <span>Voice</span>
              </button>

              <button
                class="tool"
                onclick="openCommandCenter()">
                ⌘ <span>Command</span>
              </button>

              <button
                class="tool"
                onclick="insertCodeTemplate()">
                &lt;/&gt; <span>Code</span>
              </button>

            </div>


            <div>

              <button
                class="stop-btn"
                id="stopBtn"
                onclick="stopGeneration()">
                ■
              </button>

              <button
                class="send"
                id="sendBtn"
                onclick="sendMessage()">
                ↑
              </button>

            </div>

          </div>

        </div>

      </div>

    </section>

  </main>

</div>


<!-- =======================================================
     HIDDEN FILE INPUT
======================================================== -->

<input
  type="file"
  id="fileInput"
  hidden
  multiple
  accept=".txt,.md,.csv,.json,.js,.html,.css,.py,.java,.cpp,.c,.xml,.log,.yaml,.yml,.pdf,image/*">


<!-- =======================================================
     COMMAND CENTER
======================================================== -->

<div
  class="command-overlay"
  id="commandOverlay"
  onclick="closeCommandOutside(event)">

  <div class="command-box">

    <input
      class="command-input"
      id="commandInput"
      placeholder="Search commands..."
      autocomplete="off">

    <div
      class="command-list"
      id="commandList">

      <button
        class="command-item"
        onclick="commandAction('new')">
        <span>New conversation</span>
        <span class="command-key">N</span>
      </button>

      <button
        class="command-item"
        onclick="commandAction('voice')">
        <span>Start voice mode</span>

        class="command-item"
        onclick="commandAction('study')">
        <span>Switch to Study</span>
        <span class="command-key">1</span>
      </button>

      <button
        class="command-item"
        onclick="commandAction('code')">
        <span>Switch to Code</span>
        <span class="command-key">2</span>
      </button>

      <button
        class="command-item"
        onclick="commandAction('analyze')">

    </div>

  </div>

</div>


<!-- =======================================================
     VOICE PANEL
======================================================== -->

<div
  class="voice-panel"
  id="voicePanel">

  <div class="voice-card">

    <div class="voice-visual">

      <div class="voice-ring"></div>
      <div class="voice-ring"></div>
      <div class="voice-ring"></div>

      <div class="voice-core"></div>

    </div>

    <div
      class="voice-title"
      id="voiceTitle">
      DeveshAI Voice
    </div>

    </button>

  </div>

<div
  class="status"
  id="status">
</div>


<script>

/* =========================================================
   STATE
========================================================= */

const state = {

  mode:"Ask",

  messages:[],

  attachments:[],

  abortController:null,

  generating:false

};


const modeInstructions = {

  Ask:
`You are DeveshAI in Ask mode.
Be helpful, accurate and natural.
If the user uses Hinglish, reply in easy Hinglish.
Explain things clearly and do not unnecessarily overcomplicate answers.`,

  Study:
`You are DeveshAI Study AI.
Act as a personal tutor.
Explain difficult topics step by step in simple language.
For school questions, give exam-ready answers, keywords and examples when useful.
Help the student understand rather than only giving an answer.`,

  Create:
`You are DeveshAI Creative AI.
Help the user create original ideas, writing, concepts, designs, scripts and practical projects.
Avoid generic ideas when a more interesting solution is possible.`,

  Code:
`You are DeveshAI Code AI.
Help with programming, debugging and architecture.
Prefer complete working solutions.
Explain important code clearly.
Never expose API keys or secrets.`,

  Analyze:
`You are DeveshAI Analysis AI.
Analyze information carefully.
Separate facts from assumptions.
Do not invent missing information.
Use structured reasoning when useful.`

};


/* =========================================================
   DOM
========================================================= */

const prompt =
  document.getElementById("prompt");

const messagesEl =
  document.getElementById("messages");

const welcome =
  document.getElementById("welcome");

const sendBtn =
  document.getElementById("sendBtn");

const stopBtn =
  document.getElementById("stopBtn");

const attachmentStrip =
  document.getElementById("attachmentStrip");

const fileInput =
  document.getElementById("fileInput");


/* =========================================================
   STATUS
========================================================= */

let statusTimer;

function showStatus(text){

  const el =
    document.getElementById("status");

  el.textContent = text;

  el.classList.add("show");

  clearTimeout(statusTimer);

  statusTimer =
    setTimeout(function(){

      el.classList.remove("show");

    },3000);

}


/* =========================================================
   MODE
========================================================= */

function setMode(mode){

  state.mode = mode;

  document
    .querySelectorAll(".nav-btn")
    .forEach(function(btn){

      btn.classList.toggle(
        "active",
        btn.dataset.mode === mode
      );

    });


  document.getElementById(
    "modeLabel"
  ).textContent = mode;

  closeSidebar();

  showStatus(
    mode + " mode selected"
  );

}


 /* =========================================================
    NEW CHAT
 ========================================================= */

function newChat(){

  if(
    state.messages.length &&
    !confirm("Start a new conversation?")
  ){
    return;
  }

  state.messages = [];

  state.attachments = [];

  state.abortController = null;

  state.generating = false;

  messagesEl.innerHTML = "";

  messagesEl.style.display = "none";

  welcome.style.display = "flex";

  renderAttachments();

  updateGeneratingUI(false);

  saveHistory();

  prompt.value = "";

  autoResize();

  showStatus("New conversation started");

}


/* =========================================================
   QUICK PROMPT
========================================================= */

function quickPrompt(text){

  prompt.value = text;

  autoResize();

  sendMessage();

}


/* =========================================================
   TEXTAREA
========================================================= */

prompt.addEventListener(
  "input",
  autoResize
);

function autoResize(){

  prompt.style.height = "auto";

  prompt.style.height =
    Math.min(
      prompt.scrollHeight,
      190
    ) + "px";

}


prompt.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================================================
   FILES
========================================================= */

function openFilePicker(){

  fileInput.click();

}


fileInput.addEventListener(
  "change",
  async function(){

    const files =
      Array.from(fileInput.files || []);

    for(
      const file of files
    ){

      await readAttachment(file);

    }

    fileInput.value = "";

    renderAttachments();

  }
);


async function readAttachment(file){

  const textTypes = [
    "text/plain",
    "text/csv",
    "application/json"
  ];

  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();

  const allowedText =
    [
      "txt",
      "md",
      "csv",
      "json",
      "js",
      "html",
      "css",
      "py",
      "java",
      "cpp",
      "c",
      "xml",
      "log",
      "yaml",
      "yml"
    ];


  if(
    allowedText.includes(extension) ||
    textTypes.includes(file.type)
  ){

    try{

      const text =
        await file.text();

      state.attachments.push({

        name:file.name,

        type:"text",

        content:text.slice(
          0,
          120000
        )

      });

      showStatus(
        file.name + " attached"
      );

    }catch(error){

      showStatus(
        "Could not read " +
        file.name
      );

    }

    return;

  }


  if(file.type.startsWith("image/")){

    state.attachments.push({

      name:file.name,

      type:"image",

      file:file

    });

    showStatus(
      file.name +
      " attached as image"
    );

    return;

  }


  if(extension === "pdf"){

    state.attachments.push({

      name:file.name,

      type:"unsupported",

      content:
        "PDF attached. PDF content requires server-side document processing."

    });

    showStatus(
      "PDF attached — document processing must be enabled on the server."
    );

    return;

  }


  showStatus(
    "This file type is not supported."
  );

}


function renderAttachments(){

  attachmentStrip.innerHTML = "";

  if(!state.attachments.length){

    attachmentStrip.style.display =
      "none";

    return;

  }

  attachmentStrip.style.display =
    "flex";


  state.attachments.forEach(
    function(file,index){

      const chip =
        document.createElement("div");

      chip.className =
        "attachment-chip";

      chip.innerHTML = `

        <span>
          ${escapeHtml(file.name)}
        </span>

        <button
          class="attachment-remove"
          onclick="removeAttachment(${index})">
          ×
        </button>

      `;

      attachmentStrip.appendChild(
        chip
      );

    }
  );

}


function removeAttachment(index){

  state.attachments.splice(
    index,
    1
  );

  renderAttachments();

}


/* =========================================================
   BUILD MESSAGE
========================================================= */

async function buildUserContent(text){

  const contents = [];

  contents.push({
    type:"input_text",
    text:text
  });


  for(
    const attachment of state.attachments
  ){

    if(
      attachment.type === "text"
    ){

      contents.push({

        type:"input_text",

        text:
`[Attached file: ${attachment.name}]

${attachment.content}`

      });

    }

    else if(
      attachment.type === "unsupported"
    ){

      contents.push({

        type:"input_text",

        text:
`[Attached file: ${attachment.name}]
${attachment.content}`

      });

    }

    else if(
      attachment.type === "image"
    ){

      try{

        const dataURL =
          await fileToDataURL(
            attachment.file
          );

        contents.push({

          type:"input_image",

          image_url:dataURL

        });

      }catch(error){

        console.error(
          "Image conversion failed",
          error
        );

      }

    }

  }


  return contents;

}


function fileToDataURL(file){

  return new Promise(
    function(resolve,reject){

      const reader =
        new FileReader();

      reader.onload =
        function(){

          resolve(
            reader.result
          );

        };

      reader.onerror =
        reject;

      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

  if(state.generating){

    return;

  }


  const text =
    prompt.value.trim();


  if(!text && !state.attachments.length){

    return;

  }


  const userContent =
    await buildUserContent(
      text ||
      "Please analyze the attached files."
    );


  state.messages.push({

    role:"user",

    content:
      text ||
      "Please analyze the attached files."

  });


  renderMessage(
    "user",
    text ||
    "Please analyze the attached files."
  );


  const attachmentsForDisplay =
    state.attachments.map(
      function(a){
        return a.name;
      }
    );


  if(attachmentsForDisplay.length){

    renderMessage(
      "user",
      "Attachments: " +
      attachmentsForDisplay.join(", ")
    );

  }


  prompt.value = "";

  state.attachments = [];

  renderAttachments();

  autoResize();

  showChat();

  updateGeneratingUI(true);


  state.abortController =
    new AbortController();


  try{

    const response =
      await fetch(
        "/api/chat",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            messages:[

              {
                role:"system",

                content:
                  modeInstructions[
                    state.mode
                  ]

              },

              ...state.messages

            ]

          }),

          signal:
            state.abortController.signal

        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "AI request failed."
      );

    }


    const reply =
      data.reply ||
      "Sorry, I couldn't generate a response.";


    state.messages.push({

      role:"assistant",

      content:reply

    });


    renderMessage(
      "assistant",
      reply
    );


    saveHistory();


  }catch(error){

    if(
      error.name ===
      "AbortError"
    ){

      showStatus(
        "Generation stopped."
      );

    }else{

      console.error(error);

      renderMessage(
        "assistant",
        "⚠️ " +
        (
          error.message ||
          "Something went wrong."
        )
      );

    }

  }finally{

    state.abortController = null;

    updateGeneratingUI(false);

  }

}


/* =========================================================
   RENDER MESSAGE
========================================================= */

function renderMessage(
  role,
  text
){

  welcome.style.display =
    "none";

  messagesEl.style.display =
    "block";


  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message " +
    role;


  const row =
    document.createElement("div");

  row.className =
    "message-row";


  const avatar =
    document.createElement("div");

  avatar.className =
    "avatar";

  avatar.textContent =
    role === "user"
      ? "YOU"
      : "D";


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  bubble.textContent =
    text;


  row.appendChild(avatar);

  row.appendChild(bubble);

  wrapper.appendChild(row);


  if(role === "assistant"){

    const tools =
      document.createElement("div");

    tools.className =
      "message-tools";

    tools.innerHTML = `

      <button
        class="msg-action"
        onclick="copyText(this)">
        Copy
      </button>

      <button
        class="msg-action"
        onclick="regenerateLast()">
        Regenerate
      </button>

      <button
        class="msg-action"
        onclick="speakText(this)">
        Speak
      </button>

    `;

    tools.dataset.text =
      text;

    wrapper.appendChild(
      tools
    );

  }


  messagesEl.appendChild(
    wrapper
  );


  messagesEl.scrollTop =
    messagesEl.scrollHeight;

}


function copyText(button){

  const tools =
    button.parentElement;

  const text =
    tools.dataset.text;

  navigator.clipboard
    .writeText(text)
    .then(function(){

      showStatus(
        "Copied"
      );

    });

}


function speakText(button){

  const text =
    button.parentElement.dataset.text;

  if(
    !("speechSynthesis" in window)
  ){

    showStatus(
      "Text-to-speech isn't supported."
    );

    return;

  }


  speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(
      text
    );

  utterance.lang =
    /[\u0900-\u097F]/.test(text)
      ? "hi-IN"
      : "en-IN";

  utterance.rate =
    .95;

  speechSynthesis.speak(
    utterance
  );

}


/* =========================================================
   REGENERATE
========================================================= */

async function regenerateLast(){

  if(state.generating){

    return;

  }


  if(
    state.messages.length < 2
  ){

    return;

  }


  const last =
    state.messages[
      state.messages.length - 1
    ];


  if(
    last.role !== "assistant"
  ){

    return;

  }


  state.messages.pop();

  messagesEl.innerHTML = "";

  state.messages.forEach(
    function(message){

      renderMessage(
        message.role,
        message.content
      );

    }
  );


  const lastUser =
    state.messages[
      state.messages.length - 1
    ];


  if(
    !lastUser ||
    lastUser.role !== "user"
  ){

    return;

  }


  prompt.value =
    lastUser.content;

  await sendMessage();

}


/* =========================================================
   STOP GENERATION
========================================================= */

function stopGeneration(){

  if(
    state.abortController
  ){

    state.abortController.abort();

  }

}


/* =========================================================
   GENERATION UI
========================================================= */

function updateGeneratingUI(
  active
){

  state.generating =
    active;


  sendBtn.style.display =
    active
      ? "none"
      : "inline-grid";


  stopBtn.style.display =
    active
      ? "inline-grid"
      : "none";


  sendBtn.disabled =
    active;

}


/* =========================================================
   SHOW CHAT
========================================================= */

function showChat(){

  welcome.style.display =
    "none";

  messagesEl.style.display =
    "block";

}


/* =========================================================
   COMMAND CENTER
========================================================= */

function openCommandCenter(){

  const overlay =
    document.getElementById(
      "commandOverlay"
    );

  overlay.style.display =
    "flex";


  const input =
    document.getElementById(
      "commandInput"
    );

  input.value = "";

  setTimeout(
    function(){
      input.focus();
    },
    50
  );

}


function closeCommandCenter(){

  document.getElementById(
    "commandOverlay"
  ).style.display =
    "none";

}


function closeCommandOutside(event){

  if(
    event.target.id ===
    "commandOverlay"
  ){

    closeCommandCenter();

  }

}


function commandAction(action){

  closeCommandCenter();


  if(action === "new"){

    newChat();

  }

  else if(action === "voice"){

    toggleVoice();

  }

  else if(action === "clear"){

    state.messages = [];

    messagesEl.innerHTML = "";

    messagesEl.style.display =
      "none";

    welcome.style.display =
      "flex";

    saveHistory();

    showStatus(
      "Conversation cleared"
    );

  }

  else if(action === "study"){

    setMode("Study");

  }

  else if(action === "code"){

    setMode("Code");

  }

  else if(action === "analyze"){

    setMode("Analyze");

  }

}


document.getElementById(
  "commandInput"
).addEventListener(
  "input",
  function(){

    const query =
      this.value
        .toLowerCase()
        .trim();

    document
      .querySelectorAll(
        ".command-item"
      )
      .forEach(
        function(item){

          item.style.display =
            item.textContent
              .toLowerCase()
              .includes(query)
                ? "flex"
                : "none";

        }
      );

  }
);


/* =========================================================
   CODE TEMPLATE
========================================================= */

function insertCodeTemplate(){

  prompt.value +=
`
// Paste your code here

`;

  autoResize();

  prompt.focus();

}


/* =========================================================
   HISTORY
========================================================= */

function saveHistory(){

  try{

    localStorage.setItem(
      "deveshai_history",
      JSON.stringify({
        mode:state.mode,
        messages:
          state.messages.slice(-50)
      })
    );

  }catch(error){

    console.warn(
      "History save failed",
      error
    );

  }

}


function loadHistory(){

  try{

    const raw =
      localStorage.getItem(
        "deveshai_history"
      );


    if(!raw){

      return;

    }


    const data =
      JSON.parse(raw);


    if(
      data &&
      Array.isArray(
        data.messages
      ) &&
      data.messages.length
    ){

      state.mode =
        data.mode ||
        "Ask";

      state.messages =
        data.messages;


      setMode(
        state.mode
      );


      state.messages.forEach(
        function(message){

          renderMessage(
            message.role,
            message.content
          );

        }
      );

    }

  }catch(error){

    console.warn(
      "History load failed",
      error
    );

  }

}


/* =========================================================
   SIDEBAR
========================================================= */

function toggleSidebar(){

  document
    .getElementById("sidebar")
    .classList.toggle("open");

}


function closeSidebar(){

  document
    .getElementById("sidebar")
    .classList.remove("open");

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================================
   ADVANCED REALTIME VOICE
========================================================= */

let voicePC = null;
let voiceDC = null;
let voiceStream = null;
let voiceAudio = null;

let voiceConnected = false;
let voiceStarting = false;


/* ---------------------------------------------------------
   TOGGLE
--------------------------------------------------------- */

async function toggleVoice(){

  if(voiceStarting){

    return;

  }


  if(voiceConnected){

    stopAdvancedVoice();

    return;

  }


  await startAdvancedVoice();

}


/* ---------------------------------------------------------
   START
--------------------------------------------------------- */

async function startAdvancedVoice(){

  voiceStarting = true;

  const button =
    document.getElementById(
      "voiceBtn"
    );


  try{

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        "Microphone access is not supported by this browser."
      );

    }


    showVoicePanel(
      "Requesting microphone..."
    );


    voiceStream =
      await navigator.mediaDevices
        .getUserMedia({
          audio:{
            echoCancellation:true,
            noiseSuppression:true,
            autoGainControl:true
          }
        });


    const response =
      await fetch(
        "/api/realtime/session",
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          }
        }
      );


    const session =
      await response.json();


    if(!response.ok){

      throw new Error(
        session.error ||
        "Could not create realtime session."
      );

    }


    const clientSecret =
      session.value ||
      session.client_secret?.value;


    if(!clientSecret){

      throw new Error(
        "Realtime session did not return a client secret."
      );

    }


    voicePC =
      new RTCPeerConnection();


    voiceAudio =
      document.createElement(
        "audio"
      );

    voiceAudio.autoplay =
      true;

    voiceAudio.style.display =
      "none";

    document.body.appendChild(
      voiceAudio
    );


    voicePC.ontrack =
      function(event){

        if(
          event.streams &&
          event.streams[0]
        ){

          voiceAudio.srcObject =
            event.streams[0];

        }

      };


    voiceStream
      .getTracks()
      .forEach(
        function(track){

          voicePC.addTrack(
            track,
            voiceStream
          );

        }
      );


    voiceDC =
      voicePC.createDataChannel(
        "oai-events"
      );


    voiceDC.onopen =
      function(){

        voiceConnected =
          true;

        voiceStarting =
          false;


        updateVoiceButton(
          true,
          "listening"
        );


        updateVoicePanel(
          "Listening..."
        );


        sendVoiceEvent({

          type:
            "session.update",

          session:{

            type:
              "realtime",

            instructions:
`You are DeveshAI Voice.

Speak naturally and conversationally.

If the user speaks Hinglish,
respond in easy Hinglish.

If the user speaks Hindi,
respond in Hindi.

Keep responses conversational and useful.
Do not unnecessarily give long answers.`,

            audio:{

              input:{

                turn_detection:{

                  type:
                    "server_vad",

                  threshold:
                    .5,

                  prefix_padding_ms:
                    300,

                  silence_duration_ms:
                    500

                }

              }

            }

          }

        });


        showStatus(
          "DeveshAI Voice connected"
        );

      };


    voiceDC.onmessage =
      function(event){

        try{

          const data =
            JSON.parse(
              event.data
            );

          handleVoiceEvent(
            data
          );

        }catch(error){

          console.error(
            "Voice event error",
            error
          );

        }

      };


    voiceDC.onerror =
      function(){

        showStatus(
          "Voice connection error."
        );

      };


    const offer =
      await voicePC.createOffer();


    await voicePC.setLocalDescription(
      offer
    );


    const answerResponse =
      await fetch(
        "https://api.openai.com/v1/realtime/calls",
        {
          method:"POST",

          headers:{
            "Authorization":
              "Bearer " +
              clientSecret,

            "Content-Type":
              "application/sdp"
          },

          body:
            offer.sdp
        }
      );


    if(
      !answerResponse.ok
    ){

      const error =
        await answerResponse.text();

      throw new Error(
        error ||
        "Realtime connection failed."
      );

    }


    const answer =
      await answerResponse.text();


    await voicePC.setRemoteDescription({

      type:"answer",

      sdp:answer

    });


  }catch(error){

    console.error(
      "Advanced voice error:",
      error
    );


    stopAdvancedVoice(
      false
    );


    showStatus(
      error.message ||
      "Could not start voice mode."
    );

  }

}


/* =========================================================
   VOICE EVENTS
========================================================= */

function handleVoiceEvent(event){

  if(!event){

    return;

  }


  if(
    event.type ===
    "input_audio_buffer.speech_started"
  ){

    updateVoiceButton(
      true,
      "user-speaking"
    );

    updateVoicePanel(
      "Listening..."
    );

  }


  if(
    event.type ===
    "input_audio_buffer.speech_stopped"
  ){

    updateVoiceButton(
      true,
      "thinking"
    );

    updateVoicePanel(
      "Thinking..."
    );

  }


  if(
    event.type ===
    "response.created"
  ){

    updateVoicePanel(
      "Thinking..."
    );

  }


  if(
    event.type ===
    "response.audio.delta"
  ){

    updateVoiceButton(
      true,
      "speaking"
    );

    updateVoicePanel(
      "DeveshAI is speaking..."
    );

  }


  if(
    event.type ===
    "response.audio.done"
  ){

    updateVoiceButton(
      true,
      "listening"
    );

    updateVoicePanel(
      "Listening..."
    );

  }


  if(
    event.type ===
    "response.done"
  ){

    updateVoiceButton(
      true,
      "listening"
    );

    updateVoicePanel(
      "Listening..."
    );

  }


  if(
    event.type ===
    "conversation.item.input_audio_transcription.completed"
  ){

    const transcript =
      event.transcript;

    if(transcript){

      addVoiceTranscript(
        "You",
        transcript
      );

    }

  }


  if(
    event.type ===
    "response.audio_transcript.done"
  ){

    const transcript =
      event.transcript;

    if(transcript){

      addVoiceTranscript(
        "DeveshAI",
        transcript
      );

    }

  }


  if(
    event.type ===
    "error"
  ){

    console.error(
      "Realtime error:",
      event
    );


    showStatus(
      event.error?.message ||
      "Realtime voice error."
    );

  }

}


/* =========================================================
   SEND VOICE EVENT
========================================================= */

function sendVoiceEvent(event){

  if(
    voiceDC &&
    voiceDC.readyState ===
      "open"
  ){

    voiceDC.send(
      JSON.stringify(event)
    );

  }

}


/* =========================================================
   VOICE TRANSCRIPT
========================================================= */

function addVoiceTranscript(
  speaker,
  text
){

  if(!text){

    return;

  }


  state.messages.push({

    role:
      speaker === "You"
        ? "user"
        : "assistant",

    content:text

  });


  saveHistory();

}


/* =========================================================
   VOICE UI
========================================================= */

function showVoicePanel(
  stateText
){

  const panel =
    document.getElementById(
      "voicePanel"
    );

  panel.classList.add(
    "show"
  );

  updateVoicePanel(
    stateText
  );

}


function updateVoicePanel(
  text
){

  const el =
    document.getElementById(
      "voiceState"
    );

  if(el){

    el.textContent =
      text;

  }

}


function updateVoiceButton(
  active,
  state
){

  const button =
    document.getElementById(
      "voiceBtn"
    );


  if(!button){

    return;

  }


  if(!active){

    button.classList.remove(
      "active"
    );

    button.style.color = "";

    button.style.borderColor = "";

    const span =
      button.querySelector(
        "span"
      );

    if(span){

      span.textContent =
        "Voice";

    }

    return;

  }


  button.classList.add(
    "active"
  );

  button.style.color =
    "#fff";

  button.style.borderColor =
    "#fff";


  const span =
    button.querySelector(
      "span"
    );


  if(span){

    if(state === "speaking"){

      span.textContent =
        "Speaking";

    }

    else if(state === "thinking"){

      span.textContent =
        "Thinking";

    }

    else{

      span.textContent =
        "Listening";

    }

  }

}


/* =========================================================
   STOP VOICE
========================================================= */

function stopAdvancedVoice(
  closePanel = true
){

  voiceConnected =
    false;

  voiceStarting =
    false;


  if(voiceDC){

    try{

      voiceDC.close();

    }catch(_){}

  }


  if(voicePC){

    try{

      voicePC.close();

    }catch(_){}

  }


  if(voiceStream){

    voiceStream
      .getTracks()
      .forEach(
        function(track){

          track.stop();

        }
      );

  }


  if(voiceAudio){

    try{

      voiceAudio.pause();

      voiceAudio.srcObject =
        null;

      voiceAudio.remove();

    }catch(_){}

  }


  voiceDC = null;

  voicePC = null;

  voiceStream = null;

  voiceAudio = null;


  updateVoiceButton(
    false
  );


  if(closePanel){

    document
      .getElementById(
        "voicePanel"
      )
      .classList.remove(
        "show"
      );

  }


  showStatus(
    "Voice mode stopped."
  );

}


/* =========================================================
   KEYBOARD SHORTCUTS
========================================================= */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Escape"
    ){

      closeCommandCenter();

      if(voiceConnected){

        stopAdvancedVoice();

      }

    }


    if(
      (event.ctrlKey ||
       event.metaKey) &&
      event.key === "k"
    ){

      event.preventDefault();

      openCommandCenter();

    }

  }
);


/* =========================================================
   BACKGROUND ANIMATION
========================================================= */

const canvas =
  document.getElementById(
    "background"
  );

const ctx =
  canvas.getContext("2d");

let W = 0;
let H = 0;

let pointer = {
  x:-9999,
  y:-9999
};


function resizeCanvas(){

  W =
    canvas.width =
      window.innerWidth *
      devicePixelRatio;

  H =
    canvas.height =
      window.innerHeight *
      devicePixelRatio;

  canvas.style.width =
    window.innerWidth + "px";

  canvas.style.height =
    window.innerHeight + "px";

  ctx.setTransform(
    devicePixelRatio,
    0,
    0,
    devicePixelRatio,
    0,
    0
  );

}


window.addEventListener(
  "resize",
  resizeCanvas
);


window.addEventListener(
  "pointermove",
  function(event){

    pointer.x =
      event.clientX;

    pointer.y =
      event.clientY;

  }
);


window.addEventListener(
  "pointerleave",
  function(){

    pointer.x =
      -9999;

    pointer.y =
      -9999;

  }
);


function drawBackground(
  time
){

  const width =
    window.innerWidth;

  const height =
    window.innerHeight;


  ctx.clearRect(
    0,
    0,
    width,
    height
  );


  const mobile =
    width < 700;


  const waves =
    mobile
      ? 18
      : 32;


  for(
    let i = 0;
    i < waves;
    i++
  ){

    const baseY =
      height *
      (0.08 +
       i /
       waves *
       0.92);


    ctx.beginPath();


    for(
      let x = -30;
      x <= width + 30;
      x += 14
    ){

      const wave =
        Math.sin(
          x * .008 +
          time * .00035 +
          i * .32
        ) *
        (10 + i * .18);


      const pointerDistance =
        Math.hypot(
          x - pointer.x,
          baseY - pointer.y
        );


      const influence =
        Math.max(
          0,
          1 -
          pointerDistance /
          280
        );


      const y =
        baseY +
        wave +
        influence *
        Math.sin(
          x * .025
        ) *
        24;


      if(x === -30){

        ctx.moveTo(
          x,
          y
        );

      }else{

        ctx.lineTo(
          x,
          y
        );

      }

    }


    ctx.strokeStyle =
      `rgba(255,255,255,${0.018 + i * .0005})`;

    ctx.lineWidth =
      i % 7 === 0
        ? 1.2
        : .6;

    ctx.stroke();

  }


  requestAnimationFrame(
    drawBackground
  );

}


resizeCanvas();

requestAnimationFrame(
  drawBackground
);


/* =========================================================
   INIT
========================================================= */

loadHistory();

autoResize();

</script>
