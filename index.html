<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeveshAI</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#0a0b0c;
    --panel:#111315;
    --panel2:#17191b;
    --border:#282c2f;
    --text:#f5f5f5;
    --muted:#8d9499;
    --accent:#72e6c5;
}

body{
    font-family:Inter,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    height:100vh;
    overflow:hidden;
}

/* APP */

.app{
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* HEADER */

header{
    height:64px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    border-bottom:1px solid var(--border);
    background:#0c0e0f;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo{
    width:34px;
    height:34px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#1c2523;
    border:1px solid #34433f;
    font-size:18px;
}

.brand-name{
    font-size:18px;
    font-weight:700;
    letter-spacing:-.3px;
}

.brand-name span{
    color:var(--accent);
}

.new-chat{
    border:1px solid var(--border);
    background:var(--panel);
    color:white;
    padding:9px 14px;
    border-radius:10px;
    cursor:pointer;
    transition:.2s;
}

.new-chat:hover{
    background:#1b1e20;
    border-color:#3a403f;
}

/* CHAT */

#chat{
    flex:1;
    overflow-y:auto;
    padding:25px 14px 150px;
    scroll-behavior:smooth;
}

#chat::-webkit-scrollbar{
    width:7px;
}

#chat::-webkit-scrollbar-thumb{
    background:#292d30;
    border-radius:20px;
}

/* WELCOME */

.welcome{
    min-height:68vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

.welcome-logo{
    width:72px;
    height:72px;
    border-radius:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#151b19;
    border:1px solid #34413d;
    font-size:36px;
    margin-bottom:22px;
    box-shadow:0 0 35px rgba(114,230,197,.08);
}

.welcome h1{
    font-size:38px;
    letter-spacing:-1px;
    margin-bottom:10px;
}

.welcome p{
    color:var(--muted);
    font-size:15px;
    margin-bottom:30px;
}

/* SUGGESTIONS */

.suggestions{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    width:min(600px,100%);
}

.suggestion{
    text-align:left;
    padding:15px;
    border-radius:13px;
    border:1px solid var(--border);
    background:#101214;
    color:#dfe2e3;
    cursor:pointer;
    transition:.2s;
}

.suggestion:hover{
    background:#171a1c;
    border-color:#3a403f;
    transform:translateY(-2px);
}

.suggestion strong{
    display:block;
    font-size:14px;
    margin-bottom:4px;
}

.suggestion span{
    color:var(--muted);
    font-size:12px;
}

/* MESSAGES */

.message{
    max-width:900px;
    margin:0 auto 22px;
    display:flex;
    gap:12px;
    animation:messageIn .2s ease;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(5px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.avatar{
    min-width:36px;
    height:36px;
    border-radius:11px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#191c1e;
    border:1px solid var(--border);
}

.user .avatar{
    background:#202426;
}

.bubble{
    max-width:calc(100% - 50px);
    line-height:1.65;
    white-space:pre-wrap;
    word-wrap:break-word;
    font-size:15px;
}

.user .bubble{
    background:#181b1d;
    border:1px solid #292d30;
    padding:11px 14px;
    border-radius:15px;
}

/* INPUT */

.input-area{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    padding:16px;
    background:linear-gradient(
        transparent,
        #0a0b0c 30%
    );
}

.input-box{
    max-width:900px;
    margin:auto;
    background:#151719;
    border:1px solid #303437;
    border-radius:18px;
    padding:9px;
    display:flex;
    align-items:flex-end;
    gap:8px;
    box-shadow:0 10px 40px rgba(0,0,0,.35);
}

textarea{
    flex:1;
    resize:none;
    min-height:44px;
    max-height:150px;
    border:0;
    outline:0;
    background:transparent;
    color:white;
    font-size:15px;
    padding:11px;
    font-family:inherit;
}

textarea::placeholder{
    color:#777e83;
}

.icon-btn{
    width:43px;
    height:43px;
    border:0;
    border-radius:12px;
    background:#24282a;
    color:white;
    cursor:pointer;
    font-size:17px;
    transition:.2s;
}

.icon-btn:hover{
    background:#303538;
}

.send{
    background:var(--accent);
    color:#06110e;
    font-weight:bold;
}

.send:hover{
    background:#8af0d5;
}

/* STATUS */

.status{
    max-width:900px;
    margin:6px auto 0;
    padding:0 8px;
    color:#697176;
    font-size:11px;
}

/* THINKING */

.thinking{
    display:flex;
    gap:5px;
    padding-top:8px;
}

.dot{
    width:6px;
    height:6px;
    background:#777;
    border-radius:50%;
    animation:bounce 1s infinite;
}

.dot:nth-child(2){
    animation-delay:.15s;
}

.dot:nth-child(3){
    animation-delay:.3s;
}

@keyframes bounce{
    0%,60%,100%{
        transform:translateY(0);
        opacity:.4;
    }
    30%{
        transform:translateY(-5px);
        opacity:1;
    }
}

/* MOBILE */

@media(max-width:600px){

    header{
        height:58px;
        padding:0 12px;
    }

    .brand-name{
        font-size:17px;
    }

    .new-chat{
        padding:8px 10px;
        font-size:12px;
    }

    .welcome h1{
        font-size:30px;
    }

    .welcome-logo{
        width:62px;
        height:62px;
        font-size:30px;
    }

    .suggestions{
        grid-template-columns:1fr;
    }

    #chat{
        padding:18px 10px 145px;
    }

    .bubble{
        font-size:14px;
    }

    .input-area{
        padding:10px;
    }
}
</style>
</head>

<body>

<div class="app">

<header>

    <div class="brand">

        <div class="logo">✦</div>

        <div class="brand-name">
            Devesh<span>AI</span>
        </div>

    </div>

    <button class="new-chat" onclick="newChat()">
        ＋ New chat
    </button>

</header>


<main id="chat">

    <div class="welcome" id="welcome">

        <div class="welcome-logo">
            ✦
        </div>

        <h1>What can I help with?</h1>

        <p>
            Ask anything. Learn anything. Create anything.
        </p>

        <div class="suggestions">

            <div
                class="suggestion"
                onclick="useSuggestion('Explain quantum physics simply')">

                <strong>Explain something</strong>
                <span>Make a difficult topic simple</span>

            </div>

            <div
                class="suggestion"
                onclick="useSuggestion('Give me some creative ideas')">

                <strong>Get creative ideas</strong>
                <span>Brainstorm something new</span>

            </div>

            <div
                class="suggestion"
                onclick="useSuggestion('Help me study for my exam')">

                <strong>Study smarter</strong>
                <span>Prepare for your next exam</span>

            </div>

            <div
                class="suggestion"
                onclick="useSuggestion('Write a professional email')">

                <strong>Write something</strong>
                <span>Create clear and useful text</span>

            </div>

        </div>

    </div>

</main>


<div class="input-area">

    <div class="input-box">

        <button
            class="icon-btn"
            onclick="startVoice()"
            title="Voice input">
            🎤
        </button>

        <textarea
            id="input"
            placeholder="Message DeveshAI..."
            rows="1"></textarea>

        <button
            class="icon-btn send"
            onclick="sendMessage()"
            title="Send">
            ↑
        </button>

    </div>

    <div class="status" id="status">
        DeveshAI
    </div>

</div>

</div>


<script>

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("input");

const statusText =
    document.getElementById("status");

let conversation = [];


/* ENTER TO SEND */

input.addEventListener("keydown",function(e){

    if(e.key==="Enter" && !e.shiftKey){

        e.preventDefault();

        sendMessage();

    }

});


/* AUTO RESIZE */

input.addEventListener("input",function(){

    this.style.height="auto";

    this.style.height =
        Math.min(this.scrollHeight,150)+"px";

});


/* ADD MESSAGE */

function addMessage(role,text){

    const welcome =
        document.getElementById("welcome");

    if(welcome){
        welcome.remove();
    }

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message "+role;

    const avatar =
        document.createElement("div");

    avatar.className="avatar";

    avatar.textContent =
        role==="user" ? "●" : "✦";

    const bubble =
        document.createElement("div");

    bubble.className="bubble";

    bubble.textContent=text;

    wrapper.appendChild(avatar);

    wrapper.appendChild(bubble);

    chat.appendChild(wrapper);

    chat.scrollTop =
        chat.scrollHeight;

    return bubble;

}


/* SEND */

async function sendMessage(){

    const text =
        input.value.trim();

    if(!text) return;

    input.value="";

    input.style.height="auto";

    addMessage("user",text);

    conversation.push({

        role:"user",

        content:text

    });

    statusText.textContent =
        "DeveshAI is thinking...";


    const aiBubble =
        addMessage("ai","");


    aiBubble.innerHTML = `
        <div class="thinking">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    `;


    try{

        const response =
            await fetch("/api/chat",{

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    messages:conversation

                })

            });


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.error ||
                "Server error"
            );

        }


        aiBubble.textContent =
            data.reply ||
            "No response.";


        conversation.push({

            role:"assistant",

            content:data.reply

        });


        speak(data.reply);


        statusText.textContent =
            "DeveshAI";


    }catch(error){

        console.error(error);


        aiBubble.textContent =
            "⚠️ Something went wrong. Please try again.";


        statusText.textContent =
            "Connection error";

    }

}


/* NEW CHAT */

function newChat(){

    conversation=[];


    chat.innerHTML=`

        <div class="welcome" id="welcome">

            <div class="welcome-logo">
                ✦
            </div>

            <h1>What can I help with?</h1>

            <p>
                Ask anything. Learn anything. Create anything.
            </p>

            <div class="suggestions">

                <div
                    class="suggestion"
                    onclick="useSuggestion('Explain quantum physics simply')">

                    <strong>Explain something</strong>
                    <span>Make a difficult topic simple</span>

                </div>

                <div
                    class="suggestion"
                    onclick="useSuggestion('Give me some creative ideas')">

                    <strong>Get creative ideas</strong>
                    <span>Brainstorm something new</span>

                </div>

                <div
                    class="suggestion"
                    onclick="useSuggestion('Help me study for my exam')">

                    <strong>Study smarter</strong>
                    <span>Prepare for your next exam</span>

                </div>

                <div
                    class="suggestion"
                    onclick="useSuggestion('Write a professional email')">

                    <strong>Write something</strong>
                    <span>Create clear and useful text</span>

                </div>

            </div>

        </div>

    `;


    statusText.textContent="DeveshAI";

    input.focus();

}


/* SUGGESTION */

function useSuggestion(text){

    input.value=text;

    input.dispatchEvent(
        new Event("input")
    );

    input.focus();

}


/* VOICE INPUT */

function startVoice(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if(!SpeechRecognition){

        alert(
            "Voice input is not supported here."
        );

        return;

    }


    const recognition =
        new SpeechRecognition();


    recognition.lang="en-IN";

    recognition.interimResults=false;


    statusText.textContent =
        "Listening... 🎙️";


    recognition.start();


    recognition.onresult =
        function(event){

            input.value =
                event.results[0][0].transcript;


            input.dispatchEvent(
                new Event("input")
            );


            statusText.textContent =
                "DeveshAI";

        };


    recognition.onerror =
        function(){

            statusText.textContent =
                "Voice input failed";

        };

}


/* TEXT TO SPEECH */

function speak(text){

    if(!("speechSynthesis" in window))
        return;


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(text);


    utterance.lang="en-IN";

    utterance.rate=1;


    speechSynthesis.speak(
        utterance
    );

}

</script>

</body>
</html>
