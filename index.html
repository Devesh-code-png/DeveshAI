<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeveshAI</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#0b0d10;
    color:#fff;
    height:100vh;
    overflow:hidden;
}

.app{
    height:100vh;
    display:flex;
    flex-direction:column;
}

header{
    height:60px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    border-bottom:1px solid #25282d;
    background:#101318;
}

.logo{
    font-size:20px;
    font-weight:700;
}

.logo span{
    color:#5eead4;
}

.new-chat{
    border:1px solid #30343b;
    background:#181b20;
    color:#fff;
    padding:9px 13px;
    border-radius:10px;
    cursor:pointer;
}

#chat{
    flex:1;
    overflow-y:auto;
    padding:20px 12px 130px;
}

.message{
    max-width:850px;
    margin:0 auto 18px;
    display:flex;
    gap:10px;
}

.avatar{
    min-width:34px;
    height:34px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#20242a;
}

.bubble{
    line-height:1.6;
    white-space:pre-wrap;
    word-wrap:break-word;
    max-width:calc(100% - 45px);
}

.user .bubble{
    background:#1c2229;
    padding:11px 14px;
    border-radius:14px;
}

.ai .bubble{
    padding:5px 0;
}

.welcome{
    min-height:65vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.welcome h1{
    font-size:34px;
    margin-bottom:10px;
}

.welcome p{
    color:#a7adb5;
}

.input-area{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    padding:14px;
    background:linear-gradient(transparent,#0b0d10 25%);
}

.input-box{
    max-width:850px;
    margin:auto;
    background:#171a1f;
    border:1px solid #30343b;
    border-radius:18px;
    padding:10px;
    display:flex;
    align-items:flex-end;
    gap:8px;
}

textarea{
    flex:1;
    resize:none;
    min-height:42px;
    max-height:140px;
    border:0;
    outline:0;
    background:transparent;
    color:#fff;
    font-size:16px;
    padding:10px;
    font-family:inherit;
}

.icon-btn{
    width:42px;
    height:42px;
    border:0;
    border-radius:12px;
    background:#252a31;
    color:white;
    cursor:pointer;
    font-size:18px;
}

.send{
    background:#5eead4;
    color:#06110f;
    font-weight:bold;
}

.status{
    max-width:850px;
    margin:5px auto 0;
    color:#777f89;
    font-size:12px;
    padding:0 8px;
}

@media(max-width:600px){

    .logo{
        font-size:18px;
    }

    .welcome h1{
        font-size:28px;
    }

    #chat{
        padding-left:10px;
        padding-right:10px;
    }

    .bubble{
        font-size:15px;
    }
}
</style>
</head>

<body>

<div class="app">

<header>
    <div class="logo">🤖 <span>DeveshAI</span></div>

    <button class="new-chat" onclick="newChat()">
        ＋ New chat
    </button>
</header>

<main id="chat">

    <div class="welcome" id="welcome">
        <h1>How can I help you?</h1>
        <p>Ask DeveshAI anything.</p>
    </div>

</main>

<div class="input-area">

    <div class="input-box">

        <button
            class="icon-btn"
            onclick="startVoice()"
            title="Voice input">
            🎤
        </button>

        <textarea
            id="input"
            placeholder="Message DeveshAI..."
            rows="1"></textarea>

        <button
            class="icon-btn send"
            onclick="sendMessage()"
            title="Send">
            ➤
        </button>

    </div>

    <div class="status" id="status">
        DeveshAI
    </div>

</div>

</div>

<script>

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const statusText = document.getElementById("status");

let conversation = [];

input.addEventListener("keydown", function(e){

    if(e.key === "Enter" && !e.shiftKey){

        e.preventDefault();
        sendMessage();

    }

});

input.addEventListener("input", function(){

    this.style.height = "auto";

    this.style.height =
        Math.min(this.scrollHeight,140) + "px";

});

function addMessage(role,text){

    const welcome =
        document.getElementById("welcome");

    if(welcome){
        welcome.remove();
    }

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message " + role;

    const avatar =
        document.createElement("div");

    avatar.className="avatar";

    avatar.textContent =
        role === "user" ? "👤" : "🤖";

    const bubble =
        document.createElement("div");

    bubble.className="bubble";

    bubble.textContent=text;

    wrapper.appendChild(avatar);
    wrapper.appendChild(bubble);

    chat.appendChild(wrapper);

    chat.scrollTop=chat.scrollHeight;

    return bubble;
}

async function sendMessage(){

    const text =
        input.value.trim();

    if(!text) return;

    input.value="";
    input.style.height="auto";

    addMessage("user",text);

    conversation.push({
        role:"user",
        content:text
    });

    statusText.textContent="DeveshAI is thinking...";

    const aiBubble =
        addMessage("ai","Thinking...");

    try{

        const response =
            await fetch("/api/chat",{

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({
                    messages:conversation
                })

            });

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error || "Server error"
            );

        }

        aiBubble.textContent =
            data.reply || "No response.";

        conversation.push({
            role:"assistant",
            content:data.reply
        });

        speak(data.reply);

        statusText.textContent="DeveshAI";

    }catch(error){

        console.error(error);

        aiBubble.textContent =
            "⚠️ AI server is not connected yet.";

        statusText.textContent="Waiting for backend";

    }

}

function newChat(){

    conversation=[];

    chat.innerHTML=`

        <div class="welcome" id="welcome">

            <h1>How can I help you?</h1>

            <p>Ask DeveshAI anything.</p>

        </div>

    `;

    statusText.textContent="DeveshAI";

    input.focus();

}

function startVoice(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(!SpeechRecognition){

        alert("Voice input is not supported here.");
        return;

    }

    const recognition =
        new SpeechRecognition();

    recognition.lang="en-IN";
    recognition.interimResults=false;

    statusText.textContent="Listening... 🎙️";

    recognition.start();

    recognition.onresult=function(event){

        input.value =
            event.results[0][0].transcript;

        input.dispatchEvent(
            new Event("input")
        );

        statusText.textContent="DeveshAI";

    };

    recognition.onerror=function(){

        statusText.textContent="Voice input failed";

    };

}

function speak(text){

    if(!("speechSynthesis" in window))
        return;

    speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(text);

    utterance.lang="en-IN";
    utterance.rate=1;

    speechSynthesis.speak(utterance);

}

</script>

</body>
</html>
