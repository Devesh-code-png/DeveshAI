<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DeveshAI</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --bg:#050505;
  --panel:#0b0b0b;
  --panel2:#111;
  --border:rgba(255,255,255,.09);
  --text:#f5f5f5;
  --muted:#8b8b8b;
  --white:#fff;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,Arial,Helvetica,sans-serif;
}

body{
  position:relative;
}

/* ================= BACKGROUND ================= */

.background{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:0;
  background:
    radial-gradient(circle at 50% 30%,rgba(255,255,255,.055),transparent 28%),
    radial-gradient(circle at 15% 80%,rgba(255,255,255,.025),transparent 25%),
    #050505;
}

.grid{
  position:absolute;
  inset:-50%;
  width:200%;
  height:200%;
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:55px 55px;
  transform:perspective(600px) rotateX(65deg) translateY(0);
  animation:gridMove 18s linear infinite;
  mask-image:linear-gradient(to bottom,transparent,black 30%,black 70%,transparent);
}

@keyframes gridMove{
  from{transform:perspective(600px) rotateX(65deg) translateY(0)}
  to{transform:perspective(600px) rotateX(65deg) translateY(55px)}
}

.particle{
  position:absolute;
  width:2px;
  height:2px;
  background:#fff;
  border-radius:50%;
  opacity:0;
  animation:particleFloat linear infinite;
}

@keyframes particleFloat{
  0%{transform:translateY(30px) scale(.4);opacity:0}
  15%{opacity:.35}
  70%{opacity:.15}
  100%{transform:translateY(-100vh) scale(1.2);opacity:0}
}

/* ================= APP ================= */

.app{
  position:relative;
  z-index:2;
  width:100%;
  height:100%;
  display:flex;
}

/* ================= SIDEBAR ================= */

.sidebar{
  width:260px;
  height:100%;
  background:rgba(7,7,7,.86);
  backdrop-filter:blur(25px);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  padding:18px 14px;
  transition:.35s cubic-bezier(.2,.8,.2,1);
  z-index:20;
}

.logo{
  display:flex;
  align-items:center;
  gap:11px;
  padding:8px 10px 20px;
  font-weight:800;
  letter-spacing:-.5px;
  font-size:20px;
}

.logoMark{
  width:31px;
  height:31px;
  border:1px solid rgba(255,255,255,.35);
  border-radius:10px;
  position:relative;
  overflow:hidden;
  animation:logoPulse 3s ease-in-out infinite;
}

.logoMark:before,
.logoMark:after{
  content:"";
  position:absolute;
  background:#fff;
}

.logoMark:before{
  width:18px;
  height:2px;
  top:14px;
  left:6px;
  transform:rotate(-45deg);
}

.logoMark:after{
  width:2px;
  height:18px;
  top:6px;
  left:14px;
  transform:rotate(-45deg);
}

@keyframes logoPulse{
  0%,100%{box-shadow:0 0 0 rgba(255,255,255,0)}
  50%{box-shadow:0 0 25px rgba(255,255,255,.12)}
}

.newChat{
  border:1px solid var(--border);
  background:linear-gradient(135deg,#171717,#0c0c0c);
  color:#fff;
  border-radius:13px;
  padding:13px;
  cursor:pointer;
  font-size:14px;
  text-align:left;
  transition:.25s;
  margin-bottom:12px;
}

.newChat:hover{
  transform:translateY(-2px);
  border-color:rgba(255,255,255,.22);
  box-shadow:0 12px 35px rgba(0,0,0,.35);
}

.nav{
  display:flex;
  flex-direction:column;
  gap:4px;
}

.nav button{
  border:0;
  background:transparent;
  color:#aaa;
  padding:11px 12px;
  border-radius:10px;
  text-align:left;
  cursor:pointer;
  transition:.2s;
  font-size:13px;
}

.nav button:hover,
.nav button.active{
  color:#fff;
  background:rgba(255,255,255,.065);
  transform:translateX(3px);
}

.historyTitle{
  margin:24px 10px 8px;
  font-size:10px;
  color:#555;
  text-transform:uppercase;
  letter-spacing:1.5px;
}

.history{
  overflow:auto;
  flex:1;
}

.historyItem{
  padding:9px 10px;
  color:#777;
  font-size:12px;
  border-radius:8px;
  cursor:pointer;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  transition:.2s;
}

.historyItem:hover{
  color:#ddd;
  background:rgba(255,255,255,.04);
}

.profile{
  border-top:1px solid var(--border);
  padding:14px 8px 2px;
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:32px;
  height:32px;
  border-radius:50%;

  color:#000;
  display:grid;
  place-items:center;
  font-weight:800;
  font-size:12px;
}

.profileText{
  font-size:12px;
}

.profileText small{
  display:block;
  color:#666;
  margin-top:2px;
}

/* ================= MAIN ================= */

.main{
  flex:1;
  min-width:0;
  height:100%;
  display:flex;
  flex-direction:column;
}

/* ================= TOPBAR ================= */

.topbar{
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  border-bottom:1px solid var(--border);
  background:rgba(5,5,5,.68);
  backdrop-filter:blur(22px);
  position:relative;
  z-index:10;
}

.topLeft,
.topRight{
  display:flex;
  align-items:center;
  gap:9px;
}

.iconBtn{
  width:38px;
  height:38px;
  border:1px solid transparent;
  background:transparent;
  color:#aaa;
  border-radius:10px;
  cursor:pointer;
  transition:.2s;
}

.iconBtn:hover{
  color:#fff;
  background:rgba(255,255,255,.06);
  border-color:var(--border);
}

.chatTitle{
  font-size:14px;
  font-weight:600;
  color:#ddd;
}

.model{
  padding:8px 12px;
  border:1px solid var(--border);
  border-radius:9px;
  background:#0b0b0b;
  color:#bbb;
  font-size:11px;
}

/* ================= CHAT ================= */

.chat{
  flex:1;
  overflow:auto;
  scroll-behavior:smooth;
}

.welcome{
  min-height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:50px 20px 150px;
  text-align:center;
}

.heroLogo{
  width:76px;
  height:76px;
  border:1px solid rgba(255,255,255,.2);
  border-radius:24px;
  display:grid;
  place-items:center;
  margin-bottom:25px;
  position:relative;
  overflow:hidden;
  animation:heroFloat 4s ease-in-out infinite;
  box-shadow:
    0 0 50px rgba(255,255,255,.04),
    inset 0 0 25px rgba(255,255,255,.025);
}

.heroLogo:before{
  content:"";
  position:absolute;
  width:150%;
  height:2px;
  background:#fff;
  transform:rotate(-45deg);
  animation:scan 2.7s linear infinite;
  opacity:.35;
}

.heroLogo span{
  font-size:26px;
  font-weight:900;
  position:relative;
  z-index:2;
}

@keyframes heroFloat{
  0%,100%{transform:translateY(0) rotate(0deg)}
  50%{transform:translateY(-9px) rotate(2deg)}
}

@keyframes scan{
  from{transform:translate(-100px,-100px) rotate(-45deg)}
  to{transform:translate(100px,100px) rotate(-45deg)}
}

.welcome h1{
  font-size:clamp(34px,5vw,64px);
  letter-spacing:-3px;
  line-height:1;
  margin-bottom:14px;
  background:linear-gradient(90deg,#777,#fff,#777);
  background-size:200%;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  animation:textShine 4s linear infinite;
}

@keyframes textShine{
  from{background-position:0}
  to{background-position:200%}
}

.welcome p{

  font-size:14px;
  max-width:550px;
  line-height:1.7;
}

.quick{
  margin-top:35px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  width:min(760px,100%);
}

.quick button{
  min-height:82px;
  border:1px solid var(--border);
  background:rgba(15,15,15,.75);
  color:#aaa;
  border-radius:14px;
  padding:13px;
  cursor:pointer;
  text-align:left;
  transition:.3s cubic-bezier(.2,.8,.2,1);
  position:relative;
  overflow:hidden;
}

.quick button:before{
  content:"";

  inset:0;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,.06),transparent);
  transform:translateX(-100%);
  transition:.5s;
}

.quick button:hover:before{
  transform:translateX(100%);
}

.quick button:hover{
  color:#fff;
  transform:translateY(-6px);
  border-color:rgba(255,255,255,.2);
  box-shadow:0 20px 50px rgba(0,0,0,.3);
}

.quick strong{
  display:block;
  color:#ddd;
  margin-bottom:7px;
  font-size:12px;
}

.quick span{
  font-size:10px;
  color:#666;
}

/* ================= MESSAGES ================= */

.messages{
  width:min(900px,100%);
  margin:auto;
  padding:35px 22px 170px;
}

.message{
  display:flex;
  gap:12px;
  margin:22px 0;
  animation:messageIn .45s cubic-bezier(.2,.8,.2,1);
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(15px) scale(.98);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.message.user{
  justify-content:flex-end;
}

.messageBubble{
  max-width:78%;
  padding:13px 16px;

}

.user .messageBubble{

}

.ai .messageBubble{

}

.aiAvatar{
  width:30px;

  font-size:10px;

}

/* ================= TYPING ================= */

.typing{
  display:flex;
  gap:5px;

.typing i{

  height:5px;

}

.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}

@keyframes typing{
  0%,60%,100%{transform:translateY(0);opacity:.3}
  30%{transform:translateY(-5px);opacity:1}
}

/* ================= COMPOSER ================= */

.composerWrap{
  position:absolute;
  left:260px;
  right:0;
  bottom:0;
  padding:18px 22px 20px;
  z-index:15;
  background:linear-gradient(to top,#050505 55%,transparent);
}

.composer{
  width:min(900px,100%);
  margin:auto;
  background:rgba(14,14,14,.92);
  border:1px solid rgba(255,255,255,.12);
  border-radius:19px;
  padding:10px;
  backdrop-filter:blur(25px);
  box-shadow:
    0 -10px 50px rgba(0,0,0,.3),

  transition:.3s;
}

.composer:focus-within{
  border-color:rgba(255,255,255,.25);
  box-shadow:

    0 0 50px rgba(255,255,255,.04);
}

.inputRow{
  display:flex;
  align-items:flex-end;

textarea{

textarea::placeholder{

  border:0;

  font-weight:900;
  transition:.25s;
}

.send:hover{

  box-shadow:0 0 30px rgba(255,255,255,.18);
}

.send:active{
  transform:scale(.94);
}

.tools{
  display:flex;
  align-items:center;
  gap:5px;

.tool{
  border:0;
  background:transparent;
  color:#666;

  padding:7px 9px;

}

.tool:hover{

.status{

  color:#444;

}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.62);
  backdrop-filter:blur(8px);
  z-index:30;
  opacity:0;
  pointer-events:none;
  transition:.3s;
}

.overlay.show{
  opacity:1;
  pointer-events:auto;
}

.modal{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-45%) scale(.95);
  width:min(520px,calc(100% - 30px));
  background:#0c0c0c;
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
  z-index:31;
  opacity:0;
  pointer-events:none;
  transition:.35s cubic-bezier(.2,.8,.2,1);
  box-shadow:0 30px 100px rgba(0,0,0,.7);
}

.modal.show{
  opacity:1;
  pointer-events:auto;
  transform:translate(-50%,-50%) scale(1);
}

.modal h2{
  font-size:17px;
  margin-bottom:16px;
}

.modalClose{
  float:right;
  border:0;
  background:transparent;
  color:#777;
  cursor:pointer;
  font-size:20px;
}

.modalItem{
  padding:13px;
  border:1px solid var(--border);
  border-radius:11px;
  margin-top:8px;
  color:#aaa;
  cursor:pointer;
  transition:.2s;
}

.modalItem:hover{
  color:#fff;
  background:rgba(255,255,255,.05);
  transform:translateX(4px);
}

/* ================= MOBILE ================= */

.mobileMenu{
  display:none;
}

@media(max-width:800px){

  .sidebar{
    position:fixed;
    left:0;
    top:0;

  .welcome{

  }

  .welcome h1{

  }

  .messages{
    padding-left:12px;

  }

  .messageBubble{
    max-width:88%;
  }

  .topbar{
    padding:0 10px;
  }

  .model{
    display:none;
  }
}

/* ================= SCROLLBAR ================= */

::-webkit-scrollbar{
  width:5px;
  height:5px;
}

::-webkit-scrollbar-track{
  background:transparent;
}

::-webkit-scrollbar-thumb{
  background:#252525;
  border-radius:20px;
}

::-webkit-scrollbar-thumb:hover{
  background:#444;
}
</style>
</head>

  type="file"
  id="fileInput"

  multiple
  accept=".txt,.pdf,.doc,.docx,.csv,.xls,.xlsx,.ppt,.pptx,image/*"
/>

  <h2 id="modalTitle">DeveshAI</h2>
  <div id="modalContent"></div>

<script>
/* ================= STATE ================= */

const state = {
  messages: [],
  web:false,
  busy:false,
  controller:null,
  chatId:Date.now()
};

const input = document.getElementById("input");
const messagesEl = document.getElementById("messages");
const welcome = document.getElementById("welcome");
const statusEl = document.getElementById("status");
const sendBtn = document.getElementById("sendBtn");

/* ================= START ================= */

loadHistory();

/* ================= INPUT ================= */

function autoResize(el){
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight,170) + "px";
}

function handleKey(e){
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
}

/* ================= MESSAGE ================= */

function addMessage(role,text){

  welcome.style.display = "none";

  state.messages.push({
    role,
    content:text
  });

  const wrapper = document.createElement("div");
  wrapper.className = "message " + role;

  if(role === "assistant"){

    const avatar = document.createElement("div");
    avatar.className = "aiAvatar";
    avatar.textContent = "D";

    const bubble = document.createElement("div");
    bubble.className = "messageBubble";
    bubble.textContent = text;

    wrapper.appendChild(avatar);
    wrapper.appendChild(bubble);

  }else{

    const bubble = document.createElement("div");
    bubble.className = "messageBubble";
    bubble.textContent = text;

    wrapper.appendChild(bubble);
  }

  messagesEl.appendChild(wrapper);

  requestAnimationFrame(()=>{
    document.getElementById("chat").scrollTop =
      document.getElementById("chat").scrollHeight;
  });
}

/* ================= TYPING ================= */

function showTyping(){

  const wrapper = document.createElement("div");
  wrapper.className = "message ai";
  wrapper.id = "typingMessage";

  const avatar = document.createElement("div");
  avatar.className = "aiAvatar";
  avatar.textContent = "D";

  const bubble = document.createElement("div");
  bubble.className = "messageBubble";

  const typing = document.createElement("div");
  typing.className = "typing";

  typing.innerHTML = "<i></i><i></i><i></i>";

  bubble.appendChild(typing);
  wrapper.appendChild(avatar);
  wrapper.appendChild(bubble);

  messagesEl.appendChild(wrapper);

  document.getElementById("chat").scrollTop =
    document.getElementById("chat").scrollHeight;
}

function hideTyping(){
  const el = document.getElementById("typingMessage");
  if(el) el.remove();
}

/* ================= CHAT ================= */

async function sendMessage(){

  if(state.busy) return;

  const text = input.value.trim();

  if(!text) return;

  addMessage("user",text);

  input.value = "";
  input.style.height = "auto";

  setBusy(true);
  showTyping();

  try{

    state.controller = new AbortController();

    const response = await fetch("/api/chat",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        message:text,
        messages:state.messages.slice(-20),
        web:state.web
      }),
      signal:state.controller.signal
    });

    const data = await response.json();

    hideTyping();

    if(!response.ok){
      throw new Error(data.error || "Request failed");
    }

    const reply =
      data.reply ||
      data.output ||
      data.message ||
      "I couldn't generate a response.";

    addMessage("assistant",reply);

    saveHistory(text);

  }catch(error){

    hideTyping();

    if(error.name === "AbortError"){
      addMessage("assistant","Generation stopped.");
    }else{
      addMessage(
        "assistant",
        "Something went wrong. Please try again."
      );
      console.error(error);
    }

  }finally{

    state.controller = null;
    setBusy(false);

  }
}

/* ================= STOP ================= */

function stopGeneration(){

  if(state.controller){
    state.controller.abort();
    state.controller = null;
  }

  hideTyping();
  setBusy(false);
}

/* ================= BUSY ================= */

function setBusy(value){

  state.busy = value;

  if(value){

    sendBtn.textContent = "■";
    sendBtn.onclick = stopGeneration;
    statusEl.textContent = "Thinking...";

  }else{

    sendBtn.textContent = "↑";
    sendBtn.onclick = sendMessage;
    statusEl.textContent = "Ready";
  }
}

/* ================= QUICK ================= */

function quickPrompt(text){

  input.value = text;
  autoResize(input);
  input.focus();
}

/* ================= NEW CHAT ================= */

function newChat(){

  if(state.busy) stopGeneration();

  state.messages = [];
  messagesEl.innerHTML = "";

  welcome.style.display = "flex";

  document.getElementById("chatTitle").textContent = "New Chat";

  input.value = "";
  input.style.height = "auto";

  state.chatId = Date.now();
}

/* ================= WEB ================= */

function toggleWeb(){

  state.web = !state.web;

  statusEl.textContent =
    state.web ? "Web enabled" : "Ready";

}

/* ================= VOICE ================= */

function startVoice(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    alert("Voice input is not supported in this browser.");
    return;
  }

  const recognition = new SpeechRecognition();

  recognition.lang = "en-IN";
  recognition.interimResults = true;

  recognition.onstart = ()=>{
    statusEl.textContent = "Listening...";
  };

  recognition.onresult = event=>{

    let result = "";

    for(let i=0;i<event.results.length;i++){
      result += event.results[i][0].transcript;
    }

    input.value = result;
    autoResize(input);
  };

  recognition.onend = ()=>{
    statusEl.textContent = "Ready";
  };

  recognition.onerror = ()=>{
    statusEl.textContent = "Voice error";
  };

  recognition.start();
}

/* ================= TEXT TO SPEECH ================= */

function speak(text){

  if(!("speechSynthesis" in window)) return;

  speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(text);

  utterance.rate = .95;
  utterance.pitch = 1;

  speechSynthesis.speak(utterance);
}

/* ================= FILE ================= */

document.getElementById("fileInput")
.addEventListener("change",async function(){

  const files = [...this.files];

  if(!files.length) return;

  for(const file of files){

    addMessage(
      "user",
      "Analyze this file: " + file.name
    );

    setBusy(true);
    showTyping();

    try{

      state.controller = new AbortController();

      const formData = new FormData();

      formData.append("file",file);

      formData.append(
        "question",
        "Analyze this file and explain the important information clearly."
      );

      const response = await fetch(
        "/api/files/analyze",
        {
          method:"POST",
          body:formData,
          signal:state.controller.signal
        }
      );

      const data = await response.json();

      hideTyping();

      if(!response.ok){
        throw new Error(
          data.error || "File analysis failed"
        );
      }

      addMessage(
        "assistant",
        data.reply || "File analyzed successfully."
      );

    }catch(error){

      hideTyping();

      if(error.name === "AbortError"){

        addMessage(
          "assistant",
          "File analysis stopped."
        );

      }else{

        addMessage(
          "assistant",
          "I couldn't analyze this file."
        );

        console.error(error);
      }

    }finally{

      state.controller = null;
      setBusy(false);

    }
  }

  this.value = "";
});

/* ================= HISTORY ================= */

function saveHistory(text){

  let history =
    JSON.parse(
      localStorage.getItem("deveshai-history") || "[]"
    );

  history.unshift({
    text,
    time:Date.now()
  });

  history = history.slice(0,20);

  localStorage.setItem(
    "deveshai-history",
    JSON.stringify(history)
  );

  renderHistory();
}

function loadHistory(){
  renderHistory();
}

function renderHistory(){

  const container =
    document.getElementById("history");

  let history =
    JSON.parse(
      localStorage.getItem("deveshai-history") || "[]"
    );

  container.innerHTML = "";

  history.forEach(item=>{

    const el =
      document.createElement("div");

    el.className = "historyItem";
    el.textContent = item.text;

    el.onclick = ()=>{

      input.value = item.text;
      autoResize(input);
      input.focus();

    };

    container.appendChild(el);
  });
}
